<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CLS bug</title>
<style>
  body { font-family: system-ui; margin: 0; padding: 40px; }
  h1 { font-size: 24px; }
  .banner { padding: 16px; background: #fde047; }
  /* BUG: image with no explicit width/height — causes layout shift when it loads */
  .hero img { max-width: 100%; }
  .content { padding: 16px; }
</style>
</head>
<body>
  <h1>News article</h1>
  <p>Some text above the hero image.</p>
  <div class="hero">
    <!-- 600×400 SVG that "renders late" via a small JS delay -->
    <img id="hero-img" alt="hero">
  </div>
  <div class="content">
    <p>Continuation of the article. Notice that this paragraph jumps
       down once the image above loads, causing layout shift.</p>
  </div>
  <script>
    // Simulate a slow-loading image — inject the src after a small delay,
    // which forces a layout shift after first paint.
    // Delays > networkidle's 500 ms settle window so the shifts
    // happen during the observation phase (not during page load).
    // Without this, Playwright waits past the shifts and the
    // PerformanceObserver records 0 CLS.
    setTimeout(() => {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='600' height='600' fill='%23bfdbfe'/></svg>`;
      document.getElementById('hero-img').src = 'data:image/svg+xml;utf8,' + svg;
    }, 1200);
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.style.padding = '64px';
      banner.textContent = 'Late notification banner';
      document.body.insertBefore(banner, document.body.firstChild);
    }, 1500);
    setTimeout(() => {
      const note = document.createElement('div');
      note.style.padding = '32px';
      note.style.background = '#fecaca';
      note.textContent = 'Even-later note';
      document.body.insertBefore(note, document.body.firstChild);
    }, 1800);
  </script>
</body>
</html>
