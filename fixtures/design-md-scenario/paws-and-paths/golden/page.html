<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paws &amp; Paths — Meet your walker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="hero__eyebrow">TRUSTED PET CARE</p>
      <h1 class="hero__headline">Walks that wag tails.</h1>
      <p class="hero__body">
        Book a vetted local walker in under a minute. Live GPS, photo
        updates, and a dog who comes home tired and happy.
      </p>
      <div class="hero__actions">
        <button type="button" class="btn btn--primary">Find a walker</button>
        <button type="button" class="btn btn--secondary">How it works</button>
      </div>
    </section>

    <section class="profile" aria-label="Featured walker">
      <div class="profile__avatar" aria-hidden="true"></div>
      <div class="profile__body">
        <h2 class="profile__name">Mia Carter</h2>
        <p class="profile__meta">Certified walker · Berkeley</p>
      </div>
      <span class="badge">Available today</span>
    </section>

    <section class="stats" aria-label="Walker stats">
      <article class="stat-card">
        <p class="stat-card__number">247</p>
        <p class="stat-card__label">Walks completed</p>
      </article>
      <article class="stat-card">
        <p class="stat-card__number">4.97</p>
        <p class="stat-card__label">Average rating</p>
      </article>
    </section>
  </main>
</body>
</html>
