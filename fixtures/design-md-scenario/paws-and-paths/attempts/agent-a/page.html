<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paws &amp; Paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">TRUSTED PET CARE</p>
      <h1 class="display">Walks that wag tails.</h1>
      <p class="body-lg">Book a vetted local walker in under a minute. Live GPS, photo updates, and a dog who comes home tired and happy.</p>
      <div class="button-row">
        <button class="btn btn-primary" type="button">Find a walker</button>
        <button class="btn btn-secondary" type="button">How it works</button>
      </div>
    </section>

    <section class="card-profile">
      <div class="profile-row">
        <div class="avatar" aria-hidden="true"></div>
        <div class="profile-text">
          <h2 class="title-lg">Mia Carter</h2>
          <p class="body-md profile-sub">Certified walker &middot; Berkeley</p>
        </div>
        <span class="badge-status badge-desktop">Available today</span>
      </div>
      <span class="badge-status badge-mobile">Available today</span>
    </section>

    <section class="stats-row">
      <div class="card-walk-stat">
        <p class="stat-number">247</p>
        <p class="stat-label">Walks completed</p>
      </div>
      <div class="card-walk-stat">
        <p class="stat-number">4.97</p>
        <p class="stat-label">Average rating</p>
      </div>
    </section>
  </main>
</body>
</html>
