<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paws &amp; Paths — Meet your walker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="eyebrow">TRUSTED PET CARE</div>
      <h1 class="display">Walks that wag tails.</h1>
      <p class="body-lg">Book a vetted local walker in under a minute. Live GPS, photo updates, and a dog who comes home tired and happy.</p>
      <div class="cta-row">
        <button class="btn btn-primary">Find a walker</button>
        <button class="btn btn-secondary">How it works</button>
      </div>
    </section>

    <section class="profile-card">
      <div class="profile-head">
        <div class="avatar"></div>
        <div class="profile-text">
          <h2 class="profile-name">Mia Carter</h2>
          <div class="profile-sub">Certified walker · Berkeley</div>
        </div>
        <span class="badge badge-desktop">Available today</span>
      </div>
      <span class="badge badge-mobile">Available today</span>
    </section>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-num">247</div>
        <div class="stat-label">Walks completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">4.97</div>
        <div class="stat-label">Average rating</div>
      </div>
    </section>
  </main>
</body>
</html>
