<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inbox</title><style>
body{margin:0;font:600 13px system-ui,sans-serif}
div.avatar{position:absolute;left:100px;top:100px;width:64px;height:64px;border-radius:50%}
.photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 35%,#fde68a,#f97316 45%,#7c2d12)}
span.badge{position:absolute;left:64px;top:0;height:22px;min-width:22px;padding:0 7px;box-sizing:border-box;border-radius:11px;background:#dc2626;color:#fff;
display:grid;place-items:center;transform:translate(-50%,-50%);animation:pop 400ms 1000ms both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
</style></head><body><div class="avatar"><div class="photo"></div><span class="badge">3</span></div></body></html>
