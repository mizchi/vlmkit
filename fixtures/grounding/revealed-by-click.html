<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Controls that exist only after a click</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; background: #fff; }
  #open { height: 36px; padding: 0 16px; }
  /* Icon-only, 30px apart: the second screen of a mail client's detail view. */
  .toolbar { display: flex; gap: 2px; margin-top: 16px; }
  .toolbar button { width: 30px; height: 30px; border: 0; background: #f3f4f6; border-radius: 6px; }
  .toolbar svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<button id="open">Open ticket</button>
<!-- Wired, and nothing about it is observable. -->
<button id="refresh">Refresh</button>
<div id="panel"></div>
<script>
  document.getElementById("refresh").addEventListener("click", () => { void 0; });
  document.getElementById("open").addEventListener("click", () => {
    document.getElementById("panel").innerHTML = `
      <div class="toolbar" role="toolbar" aria-label="Ticket actions">
        <button id="archive" aria-label="Archive"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="#374151"/></svg></button>
        <button id="delete" aria-label="Delete"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#b91c1c"/></svg></button>
      </div>`;
    document.getElementById("open").setAttribute("aria-expanded", "true");
  });
</script>
</body>
</html>
