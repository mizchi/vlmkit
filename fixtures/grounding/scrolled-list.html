<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A control scrolled out of its own list</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; background: #fff; }
  /* 90px tall, three 40px rows inside: rows 3+ are painted nowhere. */
  .list { width: 240px; height: 90px; overflow-y: auto; border: 1px solid #ccc; }
  .list button { display: block; width: 100%; height: 40px; border: 0;
                 border-bottom: 1px solid #eee; background: #fff; font: inherit; text-align: left; padding: 0 12px; }
  /* Same geometry, but it cannot scroll — the content is simply unreachable. */
  .locked { overflow: hidden; }
</style>
</head>
<body>
<div class="list" id="scroller">
  <button id="row-1">Row one</button>
  <button id="row-2">Row two</button>
  <button id="row-3">Row three</button>
  <button id="row-4">Row four</button>
</div>
<div class="list locked" id="locked">
  <button id="locked-1">Locked one</button>
  <button id="locked-2">Locked two</button>
  <button id="locked-3">Locked three</button>
  <button id="locked-4">Locked four</button>
</div>
</body>
</html>
