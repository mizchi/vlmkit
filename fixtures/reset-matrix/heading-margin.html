<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A fixed-height card sized for headings with no margins</title>
<style>
  body { margin: 0; font: 16px/20px sans-serif; color: #111; background: #fff; }
  .card { width: 320px; height: 64px; margin: 16px; border: 2px solid #335; background: #fff; }
  .title { font-size: 20px; line-height: 24px; }
  .meta { line-height: 20px; }
  .next { margin: 16px; }
</style>
</head>
<body>
<article class="card"><h2 class="title">Quarterly report</h2><p class="meta">Updated today</p></article>
<p class="next">Below the card.</p>
</body>
</html>
