<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>check flash: chain-timer</title>
    <!-- Known answer for `check flash` (fixtures/flash/expected.json): A timer that sets a timer that starts a full-viewport 4 Hz strobe at 3s: the second timer did not exist at load, the animation it starts extends the window. -->
    <style>html,body{margin:0;overflow:hidden;background:#fff}#f{position:fixed;inset:0;background:#fff}#f.on{animation:k 250ms 8.3ms infinite}@keyframes k{0%{background:#000;animation-timing-function:steps(1,end)}50%{background:#fff;animation-timing-function:steps(1,end)}100%{background:#fff}}</style>
  </head>
  <body>
    <div id="f"></div>
    <script>setTimeout(() => setTimeout(() => document.getElementById("f").classList.add("on"), 1500), 1500);</script>
  </body>
</html>
