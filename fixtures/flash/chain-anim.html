<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>check flash: chain-anim</title>
    <!-- Known answer for `check flash` (fixtures/flash/expected.json): A 2s fade whose animationend starts a full-viewport 4 Hz strobe: what the page begins during the sweep extends the window as what was there at load does. -->
    <style>html,body{margin:0;overflow:hidden;background:#fff}#intro{position:fixed;left:0;top:0;width:20px;height:20px;background:#888;animation:fade 2s forwards}@keyframes fade{from{opacity:0}to{opacity:1}}#f{position:fixed;inset:0;background:#fff;z-index:-1}#f.on{animation:k 250ms 8.3ms infinite}@keyframes k{0%{background:#000;animation-timing-function:steps(1,end)}50%{background:#fff;animation-timing-function:steps(1,end)}100%{background:#fff}}</style>
  </head>
  <body>
    <div id="intro"></div><div id="f"></div>
    <script>document.getElementById("intro").addEventListener("animationend", () => document.getElementById("f").classList.add("on"));</script>
  </body>
</html>
