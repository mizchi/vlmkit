<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>check flash: page-paused</title>
    <!-- Known answer for `check flash` (fixtures/flash/expected.json): The strobe of strobe-4hz with animation-play-state: paused: the page holds it at its first frame, and the sweep must not play it. -->
    <style>html,body{margin:0;overflow:hidden;background:#fff}#f{position:fixed;inset:0;background:#000;animation:k 250ms 8.3ms infinite;animation-play-state:paused}@keyframes k{0%{background:#000;animation-timing-function:steps(1,end)}50%{background:#fff;animation-timing-function:steps(1,end)}100%{background:#fff}}</style>
  </head>
  <body>
    <div id="f"></div>
  </body>
</html>
