<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>check flash: raf-5hz</title>
    <!-- Known answer for `check flash` (fixtures/flash/expected.json): A requestAnimationFrame loop toggling the background by its own timestamp, 5 flashes a second. -->
    <style>html,body{margin:0;overflow:hidden;background:#fff}#f{position:fixed;inset:0;background:#000}</style>
  </head>
  <body>
    <div id="f"></div><script>const f=document.getElementById("f");requestAnimationFrame(function loop(t){f.style.background=Math.floor((t+8.3)/100)%2?"#fff":"#000";requestAnimationFrame(loop)});</script>
  </body>
</html>
