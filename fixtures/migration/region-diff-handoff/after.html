<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Region diff handoff variant</title>
    <style id="target-css">
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #687284;
        --panel: #ffffff;
        --page: #eef3f8;
        --line: #d8e1ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .launch-panel {
        width: min(680px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        box-shadow: 0 20px 50px rgb(23 32 51 / 12%);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #0f7a5d;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.1;
      }

      .summary {
        margin: 14px 0 24px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 0 0 24px;
      }

      .metric {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f8fbfe;
      }

      .metric strong {
        display: block;
        margin-bottom: 4px;
        font-size: 20px;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .cta {
        min-width: 156px;
        height: 50px;
        border: 0;
        border-radius: 12px;
        background: #f04b4b;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
      }

      .secondary {
        min-width: 132px;
        height: 50px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
      }

      @media (max-width: 520px) {
        .launch-panel {
          padding: 24px;
        }

        .metrics {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        .cta,
        .secondary {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="launch-panel">
      <p class="eyebrow">Migration QA</p>
      <h1>Launch review dashboard</h1>
      <p class="summary">
        Confirm that the migrated page preserves the primary action treatment
        while the surrounding layout and copy remain stable.
      </p>
      <section class="metrics" aria-label="Release metrics">
        <div class="metric">
          <strong>42</strong>
          <span>Checks completed</span>
        </div>
        <div class="metric">
          <strong>8</strong>
          <span>Open follow-ups</span>
        </div>
        <div class="metric">
          <strong>99%</strong>
          <span>Snapshot stability</span>
        </div>
      </section>
      <div class="actions">
        <button class="cta" type="button">Start review</button>
        <button class="secondary" type="button">View report</button>
      </div>
    </main>
  </body>
</html>
