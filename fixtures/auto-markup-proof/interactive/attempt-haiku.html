<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferences</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f0;
      color: #333;
      padding: 40px;
      margin: 0;
    }

    .container {
      max-width: 1280px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* Disclosure button */
    #shipping-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border: 1px solid #ccc;
      background-color: #fff;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 31px;
      height: 43px;
      width: 156px;
      color: #333;
    }

    #shipping-btn:focus-visible {
      outline: 2px solid #0066cc;
      outline-offset: 2px;
    }

    #shipping-panel {
      margin-bottom: 32px;
      padding: 16px 20px;
      background-color: #fafaf8;
      border: 1px solid #e0e0dc;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
    }

    #shipping-panel[hidden] {
      display: none;
    }

    /* Tablist */
    [role="tablist"] {
      display: flex;
      border-bottom: 1px solid #e0e0dc;
      margin-bottom: 9px;
      gap: 32px;
    }

    [role="tab"] {
      padding: 12px 0;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: #999;
      border-bottom: 2px solid transparent;
      position: relative;
      bottom: -1px;
    }

    [role="tab"][aria-selected="true"] {
      color: #333;
      border-bottom-color: #333;
    }

    [role="tab"]:focus-visible {
      outline: 2px solid #0066cc;
      outline-offset: 2px;
    }

    /* Tab panels */
    [role="tabpanel"] {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 44px;
      color: #666;
    }

    [role="tabpanel"][hidden] {
      display: none;
    }

    /* Switch row */
    .switch-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .switch-label {
      font-size: 14px;
      color: #333;
    }

    [role="switch"] {
      width: 48px;
      height: 28px;
      border: none;
      border-radius: 14px;
      background-color: #d0d0cc;
      cursor: pointer;
      position: relative;
      padding: 0;
    }

    [role="switch"]:focus-visible {
      outline: 2px solid #0066cc;
      outline-offset: 2px;
    }

    [role="switch"]::before {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background-color: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
    }

    [role="switch"][aria-checked="true"] {
      background-color: #0066ff;
    }

    [role="switch"][aria-checked="true"]::before {
      left: 22px;
    }

    /* Link */
    a {
      color: #0066cc;
      text-decoration: underline;
      font-size: 14px;
      cursor: pointer;
    }

    a:focus-visible {
      outline: 2px solid #0066cc;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Preferences</h1>

    <!-- Disclosure: Shipping options -->
    <button id="shipping-btn" aria-expanded="false" aria-controls="shipping-panel">
      Shipping options
    </button>
    <div id="shipping-panel" hidden>
      Standard (5–7 days), Express (2 days), and counter pickup are available.
    </div>

    <!-- Tablist: Notification channels -->
    <div role="tablist" aria-label="Notification channels">
      <button role="tab" id="email-tab" aria-selected="true" aria-controls="email-panel" tabindex="0">
        Email
      </button>
      <button role="tab" id="push-tab" aria-selected="false" aria-controls="push-panel" tabindex="-1">
        Push
      </button>
      <button role="tab" id="digest-tab" aria-selected="false" aria-controls="digest-panel" tabindex="-1">
        Digest
      </button>
    </div>

    <!-- Tab panels -->
    <div id="email-panel" role="tabpanel" aria-labelledby="email-tab">
      Order updates and receipts go to your inbox.
    </div>
    <div id="push-panel" role="tabpanel" aria-labelledby="push-tab" hidden>
      Time-sensitive alerts on your devices.
    </div>
    <div id="digest-panel" role="tabpanel" aria-labelledby="digest-tab" hidden>
      Weekly summary of your orders.
    </div>

    <!-- Switch: Marketing emails -->
    <div class="switch-row">
      <span class="switch-label" id="marketing-label">Marketing emails</span>
      <button role="switch" aria-checked="false" aria-labelledby="marketing-label"></button>
    </div>

    <!-- Link: Privacy policy -->
    <a href="#">Privacy policy</a>
  </div>

  <script>
    // Disclosure button functionality
    const shippingBtn = document.getElementById('shipping-btn');
    const shippingPanel = document.getElementById('shipping-panel');

    shippingBtn.addEventListener('click', () => {
      const isExpanded = shippingBtn.getAttribute('aria-expanded') === 'true';
      shippingBtn.setAttribute('aria-expanded', !isExpanded);
      shippingPanel.hidden = isExpanded;
    });

    shippingBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        shippingBtn.click();
      }
    });

    // Tab functionality
    const tablist = document.querySelector('[role="tablist"]');
    const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
    let currentTabIndex = 0;

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        selectTab(index);
      });

      tab.addEventListener('keydown', (e) => {
        let newIndex = currentTabIndex;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          newIndex = (currentTabIndex + 1) % tabs.length;
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          newIndex = (currentTabIndex - 1 + tabs.length) % tabs.length;
        }
        if (newIndex !== currentTabIndex) {
          selectTab(newIndex);
        }
      });
    });

    function selectTab(index) {
      // Update tabindex on all tabs
      tabs.forEach((tab, i) => {
        if (i === index) {
          tab.setAttribute('aria-selected', 'true');
          tab.setAttribute('tabindex', '0');
          tab.focus();
        } else {
          tab.setAttribute('aria-selected', 'false');
          tab.setAttribute('tabindex', '-1');
        }
      });

      // Show/hide panels
      const panelIds = tabs.map(tab => tab.getAttribute('aria-controls'));
      panelIds.forEach((panelId, i) => {
        const panel = document.getElementById(panelId);
        if (i === index) {
          panel.hidden = false;
        } else {
          panel.hidden = true;
        }
      });

      currentTabIndex = index;
    }

    // Switch functionality
    const switchBtn = document.querySelector('[role="switch"]');
    let isSwitchOn = switchBtn.getAttribute('aria-checked') === 'true';

    switchBtn.addEventListener('click', () => {
      toggleSwitch();
    });

    switchBtn.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleSwitch();
      }
    });

    function toggleSwitch() {
      isSwitchOn = !isSwitchOn;
      switchBtn.setAttribute('aria-checked', isSwitchOn);
    }

    switchBtn.addEventListener('focus', () => {
      // Focus handling is already done by :focus-visible in CSS
    });
  </script>
</body>
</html>
