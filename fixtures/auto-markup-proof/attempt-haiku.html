<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compose the page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #000;
    }

    header {
      background: #1c2c34;
      color: white;
      padding: 40px;
      border-radius: 12px;
      margin: 24px 40px 24px 40px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    header p {
      font-size: 1rem;
      line-height: 1.3;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 24px 40px;
    }

    .card {
      background: #ecf4fc;
      padding: 25px;
      border-radius: 8px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.9rem;
      color: #666;
    }

    .cta {
      background: #2464ec;
      color: white;
      text-align: center;
      padding: 27px 40px;
      margin: 24px 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cta h2 {
      font-size: 2rem;
      font-weight: bold;
      margin: 0;
    }

    footer {
      background: #e4e4ec;
      padding: 28px 30px;
      margin: 24px 40px 40px 40px;
      border-radius: 8px;
    }

    footer p {
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Compose the page</h1>
    <p>Hero copy goes here.</p>
  </header>

  <div class="cards">
    <div class="card">
      <h2>Card A</h2>
      <p>alpha</p>
    </div>
    <div class="card">
      <h2>Card B</h2>
      <p>beta</p>
    </div>
    <div class="card">
      <h2>Card C</h2>
      <p>gamma</p>
    </div>
  </div>

  <div class="cta">
    <h2>Ready to start?</h2>
  </div>

  <footer>
    <p>Footer content</p>
  </footer>
</body>
</html>
