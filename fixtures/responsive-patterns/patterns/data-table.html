<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor &amp; Pine — recent orders</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 "Liberation Sans", Arial, sans-serif; color: #1b2027; background: #f4f5f7; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 24px; margin: 0 0 16px; }
.card { background: #fff; border: 1px solid #dde1e7; border-radius: 12px; padding: 16px; }
/* Pattern: a table that scrolls sideways inside its card, and becomes stacked cards on phones. */
.table-wrap { overflow-x: auto; }
table { width: 100%; min-width: 640px; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eceff3; white-space: nowrap; }
th { font-size: 13px; color: #5b6573; font-weight: 600; }
td.amount, th.amount { text-align: right; }
@media (max-width: 599px) {
  table { min-width: 0; }
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  tr { display: block; padding: 10px 0; border-bottom: 1px solid #eceff3; }
  td { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border: 0; white-space: normal; }
  td::before { content: attr(data-label); color: #5b6573; font-size: 13px; }
}
</style>
</head>
<body>
<main>
  <h1>Recent orders</h1>
  <section class="card" aria-label="Orders">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Channel</th><th class="amount">Amount</th></tr></thead>
        <tbody>
          <tr><td data-label="Order">#10482</td><td data-label="Date">Sep 22, 14:05</td><td data-label="Customer">Mara Ellison</td><td data-label="Channel">Online store</td><td class="amount" data-label="Amount">$184.00</td></tr>
          <tr><td data-label="Order">#10481</td><td data-label="Date">Sep 22, 13:41</td><td data-label="Customer">Tobias Reyes</td><td data-label="Channel">Wholesale</td><td class="amount" data-label="Amount">$1,240.50</td></tr>
          <tr><td data-label="Order">#10480</td><td data-label="Date">Sep 22, 11:18</td><td data-label="Customer">June Okafor</td><td data-label="Channel">Market stall</td><td class="amount" data-label="Amount">$42.00</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
