<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Card — Reference</title>
<style id="target-css">
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --line: #e5e7eb;
  --text: #0f172a;
  --text-muted: #64748b;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
button, input { font: inherit; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 360px;
  width: 100%;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.badge {
  display: inline-flex;
  width: fit-content;
  padding: 4px 10px;
  border-radius: 999px;
  background: #dbeafe;
  color: #1d4ed8;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }

.price-row { display: flex; align-items: baseline; gap: 6px; }
.price { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.price-period { color: var(--text-muted); font-size: 14px; }

.features { display: flex; flex-direction: column; gap: 10px; }
.feature { display: flex; gap: 10px; font-size: 14px; color: var(--text); line-height: 1.5; }
.feature::before {
  content: "✓";
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
}

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 11px 16px;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.cta:hover { background: var(--accent-hover); }
</style>
</head>
<body>
<article class="card">
  <span class="badge">Popular</span>
  <h2 class="title">Pro plan</h2>
  <div class="price-row">
    <span class="price">$24</span>
    <span class="price-period">/ month</span>
  </div>
  <ul class="features">
    <li class="feature">Unlimited projects</li>
    <li class="feature">Priority email support</li>
    <li class="feature">Custom domain</li>
    <li class="feature">Team access (up to 5)</li>
  </ul>
  <button class="cta" type="button">Start free trial</button>
</article>
</body>
</html>
