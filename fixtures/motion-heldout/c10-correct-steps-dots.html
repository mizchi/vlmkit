<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.panel{margin:120px auto;width:320px;background:#fff;border-radius:12px;padding:32px;text-align:center;border:1px solid #dde1e8}
.loader{position:relative;width:48px;height:48px;margin:0 auto 12px;animation:tick 800ms steps(8,end) infinite}
.loader i{position:absolute;left:21px;top:0;width:6px;height:6px;border-radius:50%;background:#2563eb;transform-origin:3px 24px}
@keyframes tick{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style></head><body>
<div class="panel"><div class="loader"><i style="rotate:0deg;opacity:1"></i><i style="rotate:45deg;opacity:.88"></i><i style="rotate:90deg;opacity:.76"></i><i style="rotate:135deg;opacity:.64"></i><i style="rotate:180deg;opacity:.52"></i><i style="rotate:225deg;opacity:.4"></i><i style="rotate:270deg;opacity:.28"></i><i style="rotate:315deg;opacity:.16"></i></div>Preparing export&hellip;</div>
</body></html>
