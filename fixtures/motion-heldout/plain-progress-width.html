<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.box{margin:80px auto;width:480px;background:#fff;border-radius:12px;padding:24px;border:1px solid #dde1e8}
.track{height:10px;border-radius:5px;background:#e3e7ee;overflow:hidden;margin:14px 0}
.fill{height:100%;width:0;background:#2563eb;border-radius:5px;transition:width 600ms ease-in-out}
.fill.go{width:70%}
.start{padding:6px 14px;border-radius:6px;border:0;background:#2563eb;color:#fff;cursor:pointer}
</style></head><body>
<div class="box"><strong>report.pdf</strong><div class="track"><div class="fill"></div></div><button class="start">Upload</button></div>
<script>document.querySelector('.start').addEventListener('click',()=>document.querySelector('.fill').classList.add('go'));</script>
</body></html>
