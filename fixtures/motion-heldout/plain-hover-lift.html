<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article card</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.wrap{display:flex;justify-content:center;padding-top:100px}
.card{width:340px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 8px #0001;transition:transform 150ms ease-out,box-shadow 150ms ease-out;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}
</style></head><body>
<div class="wrap"><article class="card"><h2 style="margin:0 0 8px">Designing calm interfaces</h2><p>Six habits for quieter product UI.</p></article></div>
</body></html>
