<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature card</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.wrap{display:flex;justify-content:center;padding-top:100px}
.card{width:320px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px #0002;animation:rise 400ms ease-out both;transition:scale 160ms ease-out;cursor:pointer}
.card:hover{scale:1.04}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
</style></head><body>
<div class="wrap"><article class="card"><h2 style="margin:0 0 8px">Shared inboxes</h2><p>Answer customers together without stepping on each other.</p></article></div>
</body></html>
