<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved toast</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.toast{position:fixed;right:24px;bottom:24px;width:300px;background:#1d2330;color:#fff;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px #0003}
.toast-close{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
</style></head><body>
<main style="padding:24px"><h1>Settings</h1><p>Your changes were saved.</p></main>
<div class="toast" role="status"><span>Settings saved</span><button class="toast-close" aria-label="Dismiss">&times;</button></div>
<script>
const toast=document.querySelector('.toast');
document.querySelector('.toast-close').addEventListener('click',()=>{
  toast.animate([{opacity:1,translate:'0 0'},{opacity:0,translate:'0 8px'}],{duration:300,easing:'ease-in'});
  toast.style.display='none';
});
</script></body></html>
