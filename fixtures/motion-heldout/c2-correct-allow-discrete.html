<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcement</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.panel{margin:40px auto;width:560px;background:#fff;border:1px solid #dde1e8;border-radius:12px;padding:20px 24px;display:block;opacity:1;transition:opacity 250ms ease,display 250ms allow-discrete}
.panel.closed{display:none;opacity:0}
.dismiss{margin-top:12px;padding:6px 14px;border-radius:6px;border:1px solid #b9c0cc;background:#f7f8fa;cursor:pointer}
</style></head><body>
<div class="panel"><strong>New: dark mode</strong><p>Switch themes from your profile menu.</p><button class="dismiss">Dismiss</button></div>
<script>
document.querySelector('.dismiss').addEventListener('click',()=>document.querySelector('.panel').classList.add('closed'));
</script></body></html>
