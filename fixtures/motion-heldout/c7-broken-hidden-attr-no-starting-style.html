<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account menu</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.bar{display:flex;justify-content:flex-end;padding:16px 24px;background:#fff;border-bottom:1px solid #dde1e8;position:relative}
.menu-btn{padding:8px 14px;border-radius:8px;border:1px solid #c6ccd6;background:#fff;cursor:pointer}
.menu{position:absolute;right:24px;top:60px;width:200px;margin:0;padding:6px 0;list-style:none;background:#fff;border-radius:10px;box-shadow:0 10px 30px #0003;display:block;opacity:1;translate:0 0;transition:opacity 200ms ease-out,translate 200ms ease-out}
.menu[hidden]{display:none;opacity:0;translate:0 -8px}
.menu li{padding:8px 16px}
</style></head><body>
<div class="bar"><button class="menu-btn" aria-expanded="false">Sam &#9662;</button>
<ul class="menu" hidden><li>Profile</li><li>Billing</li><li>Sign out</li></ul></div>
<script>
const b=document.querySelector('.menu-btn'),m=document.querySelector('.menu');
b.addEventListener('click',()=>{m.hidden=!m.hidden;b.setAttribute('aria-expanded',!m.hidden)});
</script></body></html>
