<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings list</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.list{margin:40px auto;width:520px;background:#fff;border-radius:12px;border:1px solid #dde1e8;padding:0;list-style:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1px solid #eef0f4;cursor:pointer}
.row:first-child{border-top:0}
.chev{display:inline-block;color:#8a93a3;font-size:20px;inset-inline-start:0;transition:inset-inline-start 200ms ease-out}
.row:hover .chev{inset-inline-start:6px}
</style></head><body>
<ul class="list">
<li class="row"><span>Account</span><span class="chev">&rsaquo;</span></li>
<li class="row"><span>Notifications</span><span class="chev">&rsaquo;</span></li>
<li class="row"><span>Privacy</span><span class="chev">&rsaquo;</span></li>
</ul></body></html>
