<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snackbar</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.snack{position:fixed;left:50%;margin-left:-180px;width:360px;height:52px;box-sizing:border-box;bottom:24px;background:#1d2330;color:#fff;border-radius:8px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;animation:rise 400ms ease-out 200ms both}
.snack b{color:#8ab4ff}
@keyframes rise{from{bottom:-60px}to{bottom:24px}}
</style></head><body>
<main style="padding:24px"><h1>Inbox</h1><p>3 conversations</p></main>
<div class="snack" role="status">Message archived <b>Undo</b></div>
</body></html>
