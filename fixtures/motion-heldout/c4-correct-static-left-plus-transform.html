<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome card</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.wrap{padding:80px 0 0 400px}
.welcome{width:360px;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 16px #0002;animation:enter 450ms ease-out 150ms both}
@keyframes enter{from{left:-200px;transform:translateX(-200px);opacity:0}to{left:0;transform:none;opacity:1}}
</style></head><body>
<div class="wrap"><section class="welcome"><h2 style="margin:0 0 6px">Welcome back, Sam</h2><p>You have 2 tasks due today.</p></section></div>
</body></html>
