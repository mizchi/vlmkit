<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing card</title><style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1d2330}
.wrap{display:flex;justify-content:center;padding-top:100px}
.plan{width:300px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px #0002;transition:scale 180ms ease-out;cursor:pointer}
.plan:hover{scale:1.06}
.plan h2{margin:0}.price{font:700 32px system-ui;margin:8px 0}
</style></head><body>
<div class="wrap"><article class="plan"><h2>Pro</h2><div class="price">$12/mo</div><p>Unlimited projects and priority support.</p></article></div>
<script>
document.querySelector('.plan').animate([{scale:0.85,opacity:0},{scale:1,opacity:1}],{duration:350,easing:'ease-out',fill:'forwards'});
</script></body></html>
