<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast over the label until it is dismissed at 10s</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #1f2328; background: #fff; }
  main { position: relative; height: 320px; padding: 24px; }
  .label { position: absolute; left: 360px; top: 60px; margin: 0; font-size: 18px; }
  .toast { position: absolute; left: 340px; top: 40px; width: 300px; height: 80px; padding: 12px; box-sizing: border-box;
           background: #2255cc; color: #fff; border-radius: 8px; }
  @keyframes out { to { transform: translateY(400px); } }
  .toast { animation: out 300ms ease-in 10s 1 forwards; }
</style></head>
<body><main>
  <p class="label">Shipping estimate: 3 days</p>
  <div class="toast">Saved</div>
</main></body></html>
