<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card held over the label mid-motion</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #1f2328; background: #fff; }
  main { position: relative; height: 320px; padding: 24px; }
  .label { position: absolute; left: 360px; top: 60px; margin: 0; font-size: 18px; }
  .card { position: absolute; left: 24px; top: 40px; width: 220px; height: 80px; padding: 12px; box-sizing: border-box;
          background: #2255cc; color: #fff; border-radius: 8px; }
  @keyframes across { from { transform: translateX(0); } 20% { transform: translateX(330px); } 80% { transform: translateX(330px); } to { transform: translateX(720px); } }
  .card { animation: across 1000ms linear 1 forwards; }
</style></head>
<body><main>
  <p class="label">Shipping estimate: 3 days</p>
  <div class="card">Order summary</div>
</main></body></html>
