<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Release notes</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main>
    <h1>Release notes</h1>

    <!-- Toolbar. DOM order is Publish, Save, Discard. -->
    <div class="toolbar">
      <button id="publish" class="btn">Publish</button>
      <button id="save" class="btn">Save draft</button>
      <button id="discard" class="btn">Discard</button>
    </div>

    <section class="cards">
      <article class="card">
        <h2>1.4.0</h2>
        <p>Adds the export pipeline.</p>
      </article>
      <article class="card card--featured">
        <h2>1.5.0</h2>
        <p>Rewrites the scheduler.</p>
      </article>
      <article class="card">
        <h2>1.6.0</h2>
        <p>Drops the legacy adapter.</p>
      </article>
    </section>

    <div class="spinner" aria-hidden="true"></div>
  </main>
</body>
</html>
