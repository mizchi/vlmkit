<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>External-asset gate fixture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="card">
      <p class="low-contrast">Grey on white, below the WCAG floor.</p>
      <p class="hidden-copy">Refunds processed within 14 days.</p>
      <p class="off-scale">Padding one pixel off the page's own scale.</p>
    </div>
    <!-- Focus order: DOM order is a, b, c; style.css positions them at
         x=700 / x=20 / x=360, so tabbing goes rightmost, far-left, middle. -->
    <div class="focus-row">
      <button id="focus-a">First in DOM, rightmost on screen</button>
      <button id="focus-b">Second in DOM, leftmost on screen</button>
      <button id="focus-c">Third in DOM, middle on screen</button>
    </div>
    <!-- Component consistency: the modifier that makes one instance inconsistent
         (padding 28px against 12px) exists only in style.css. -->
    <div class="tile">Alpha</div>
    <div class="tile tile--wrong">Beta</div>
    <div class="tile">Gamma</div>
    <div class="card">
      <button class="btn-a">Buy</button>
      <button class="btn-a">Save</button>
      <button class="btn-b">Cancel</button>
      <button class="btn-c">Ghost</button>
      <a class="tiny-tap" href="#x" aria-label="Tiny tap target"></a>
    </div>
  </main>
</body>
</html>
