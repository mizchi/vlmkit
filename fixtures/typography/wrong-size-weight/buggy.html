<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pricing — buggy</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; background: #f6f7fb; color: #111827; }
  .card {
    max-width: 360px;
    margin: 24px auto;
    padding: 28px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  /* BUG: heading is too small + not bold enough */
  .heading {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 8px;
  }
  /* BUG: price is way too small */
  .price {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .body {
    font-size: 14px;
    font-weight: 400;
    color: #4b5563;
    margin: 0 0 16px;
  }
  .note {
    font-size: 12px;
    font-weight: 400;
    color: #9ca3af;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h2 class="heading">Premium plan</h2>
    <div class="price">$24</div>
    <p class="body">Unlimited access to all features, including priority support.</p>
    <p class="note">Cancel anytime.</p>
  </div>
</body>
</html>
