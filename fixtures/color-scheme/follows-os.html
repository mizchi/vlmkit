<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account settings</title>
<!--
  A page that follows the OS theme through prefers-color-scheme, with defects in its dark theme only:
  the hint keeps its light-theme grey (#5f6368, 3.1:1 on #121212), the field's fill and border sit
  on the page's own dark surface, and the footnote's ink was never changed from the dark background.
  Light: every gate that reads paint is clean. `--color-scheme dark`: each one names its defect.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #ffffff; color: #1f1f1f; }
  main { max-width: 560px; margin: 48px auto; padding: 0 24px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
  .hint { color: #5f6368; margin: 0 0 24px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid #767676; border-radius: 6px; background: #ffffff; color: inherit; }
  .footnote { margin: 24px 0 0; font-size: 14px; color: #1f1f1f; }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #e8e8e8; }
    input { background: #121212; border-color: #1c1c1c; }
    .footnote { color: #141414; }
  }
</style>
</head>
<body>
<main>
  <h1>Account settings</h1>
  <p class="hint">Changes are saved when you leave the field.</p>
  <label for="name">Display name</label>
  <input id="name" type="text" value="Ada Lovelace">
  <p class="footnote">Your display name is shown on every comment you post.</p>
</main>
</body>
</html>
