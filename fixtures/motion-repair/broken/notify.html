<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inbox</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f4f5f7; color: #1d2330; }
  .topbar { position: relative; height: 64px; overflow: hidden; background: #1d2330; color: #fff;
            display: flex; align-items: center; padding: 0 32px; }
  .topbar h1 { font-size: 18px; margin: 0; }
  .notice { position: absolute; right: 32px; top: 72px; width: 320px; padding: 16px 18px;
            background: #fff; color: #1d2330; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
            animation: drop 420ms cubic-bezier(0, 0, 0.58, 1) 200ms both; }
  .notice strong { display: block; margin-bottom: 4px; }
  @keyframes drop { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
  main { max-width: 960px; margin: 40px auto; padding: 0 32px; }
  .mail { background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 12px; }
</style></head>
<body>
  <header class="topbar">
    <h1>Inbox</h1>
    <div class="notice" role="status"><strong>New message from Dana</strong>The Q3 numbers are in — have a look before Friday.</div>
  </header>
  <main>
    <div class="mail"><strong>Ravi</strong> — Lunch on Thursday?</div>
    <div class="mail"><strong>Billing</strong> — Your invoice for September</div>
    <div class="mail"><strong>Mei</strong> — Slides for the offsite</div>
  </main>
</body></html>
