<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Plans</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f5f3ff; color: #1e1b4b; }
  main { max-width: 1040px; margin: 48px auto; padding: 0 24px; }
  h1 { margin: 0 0 24px; }
  .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; list-style: none; padding: 0; margin: 0; }
  .plan { padding: 24px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(30, 27, 75, 0.1); transition: transform 150ms ease-out, box-shadow 150ms ease-out; animation: rise 400ms ease-out both; animation-delay: calc(var(--i) * 100ms); }
  .plan:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(30, 27, 75, 0.16); }
  @media (max-width: 720px) { .plans { grid-template-columns: 1fr; } }
  .plan h2 { margin: 0 0 4px; font-size: 18px; }
  .plan .price { font-size: 28px; font-weight: 700; margin: 8px 0; }
  .plan p { margin: 0; color: #4c4a6b; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <main>
    <h1>Choose a plan</h1>
    <ul class="plans">
      <li class="plan" id="p1" style="--i: 0"><h2>Starter</h2><div class="price">¥0</div><p>One project, community support.</p></li>
      <li class="plan" id="p2" style="--i: 1"><h2>Team</h2><div class="price">¥1,200</div><p>Ten projects, shared billing.</p></li>
      <li class="plan" id="p3" style="--i: 2"><h2>Business</h2><div class="price">¥4,800</div><p>Unlimited projects, SSO, audit log.</p></li>
    </ul>
  </main>
</body></html>
