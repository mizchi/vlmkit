<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Plans</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #0f1222; color: #e8eaf6; display: grid; place-items: center; min-height: 100vh; }
  .plan { width: 420px; padding: 36px; border-radius: 18px; background: #181c33; text-align: center; }
  .plan h1 { font-size: 26px; margin: 0 0 8px; }
  .plan p { margin: 0 0 28px; color: #a9afd1; }
  .upgrade { display: inline-block; padding: 16px 44px; border: 0; border-radius: 999px; color: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer;
    background: linear-gradient(90deg, #2563eb, #4f46e5); transition: background 300ms ease; }
  .upgrade:hover { background: linear-gradient(90deg, #9333ea, #db2777); }
</style></head>
<body>
  <div class="plan">
    <h1>Pro</h1>
    <p>Unlimited projects, priority support, and the new timeline view.</p>
    <button class="upgrade" type="button">Upgrade</button>
  </div>
</body></html>
