<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Report</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f4f5f7; color: #20242a; }
  .bar { display: flex; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #dde1e6; }
  .bar button { font: inherit; padding: 6px 12px; border: 1px solid #c9ced6; border-radius: 6px; background: #fff; }
  .filter { position: relative; }
  .tip { position: absolute; top: calc(100% + 6px); left: 0; width: 300px; padding: 12px 14px; background: #20242a; color: #fff;
         border-radius: 8px; font-size: 14px; transform-origin: bottom;
         animation: unfold 240ms cubic-bezier(0, 0, 0.58, 1) 350ms both; }
  @keyframes unfold { from { transform: scaleY(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
  main { padding: 120px 24px 24px; }
</style></head>
<body>
  <div class="bar">
    <button type="button">Export</button>
    <span class="filter"><button type="button" aria-describedby="tip">Filter</button>
      <span class="tip" id="tip" role="tooltip">Filter by owner, status or date. Saved filters show up in the sidebar.</span></span>
    <button type="button">Share</button>
  </div>
  <main><h1>Quarterly report</h1><p>Revenue grew 12% over the last quarter.</p></main>
</body></html>
