<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Deploys</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, ui-sans-serif, sans-serif; background: #0b1020; color: #e2e8f0; }
  main { max-width: 640px; margin: 56px auto; padding: 0 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; color: #fff; }
  ol { list-style: none; padding: 0; margin: 0; }
  .row { display: flex; justify-content: space-between; padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; background: #151c33; animation: row-in 300ms ease-out backwards; animation-delay: calc(var(--i) * -80ms); }
  .row b { color: #7dd3fc; font-weight: 600; }
  @keyframes row-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <main>

</body></html>
