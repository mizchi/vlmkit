<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Files</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #eef1f4; color: #1b2430; }
  .shell { opacity: 0; animation: shellIn 300ms ease-out both; }
  @keyframes shellIn { from { opacity: 0; } to { opacity: 1; } }
  header { height: 56px; display: flex; align-items: center; padding: 0 24px; background: #fff; border-bottom: 1px solid #d9dee5; }
  .drawer { position: fixed; top: 56px; left: 0; bottom: 0; width: 280px; padding: 20px; background: #1b2430; color: #fff;
            animation: drawer-in 380ms cubic-bezier(0, 0, 0.58, 1) 400ms both; }
  .drawer a { display: block; color: #fff; text-decoration: none; padding: 8px 0; }
  @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: none; } }
  main { margin-left: 280px; padding: 32px; }
  .file { background: #fff; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; }
</style></head>
<body>
  <div class="shell">
    <header><strong>Files</strong></header>
    <nav class="drawer" aria-label="Folders"><a href="#">All files</a><a href="#">Shared with me</a><a href="#">Starred</a><a href="#">Trash</a></nav>
    <main>
      <div class="file">Quarterly report.pdf</div>
      <div class="file">Brand assets.zip</div>
      <div class="file">Meeting notes.md</div>
    </main>
  </div>
</body></html>
