<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Retreat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f6f4ef; color: #1f2a20; display: grid; place-items: center; min-height: 100vh; }
  .hero { width: 640px; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 8px 28px rgba(31, 42, 32, 0.14); animation: focus-in 600ms ease-out both; }
  .hero .photo { height: 280px; background: linear-gradient(160deg, #6b8f71 0%, #2f4f3a 55%, #c9b37e 100%); }
  .hero .text { padding: 20px 24px; }
  .hero h1 { margin: 0 0 6px; font-size: 26px; }
  .hero p { margin: 0; color: #4b5a4c; }
  @keyframes focus-in { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: blur(0); } }
</style></head>
<body>
  <article class="hero">
    <div class="photo" role="img" aria-label="Forest lodge at dusk"></div>
    <div class="text">
      <h1>Three nights in the cedar forest</h1>
      <p>Wood stove, hot spring, no signal. From ¥48,000 per person.</p>
    </div>
  </article>
</body></html>
