<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Storage</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, ui-sans-serif, sans-serif; background: #fff; color: #111827; }
  main { max-width: 560px; margin: 80px auto; padding: 0 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .track { height: 14px; border-radius: 7px; background: #e5e7eb; overflow: hidden; }
  .fill { display: block; height: 100%; background: #2563eb; border-radius: 7px; animation: fill-up 800ms ease-out both; }
  @keyframes fill-up { from { width: 0; } to { width: 72%; } }
  p { color: #4b5563; margin: 8px 0 0; }
</style></head>
<body>
  <main>
    <h1>Storage</h1>
    <div class="track"><span class="fill" id="fill"></span></div>
    <p>72% of 50 GB used</p>
  </main>
</body></html>
