<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Search</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #1d1f23; }
  main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid #c8ccd2; border-radius: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
           animation: chips-in 200ms ease-out both; }
  .chips span { padding: 6px 12px; border-radius: 999px; background: #eef1f5; font-size: 14px; }
  @keyframes chips-in { from { opacity: 0; } to { opacity: 1; } }
</style></head>
<body>
  <main>
    <h1>Search</h1>
    <input type="search" placeholder="Search the docs" aria-label="Search the docs">
    <div class="chips" aria-label="Popular searches"><span>Pricing</span><span>API keys</span><span>Webhooks</span><span>SSO</span></div>
  </main>
</body></html>
