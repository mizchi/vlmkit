<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing plans</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: #eef1f5;
    color: #1d2433;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    position: relative;
  }
  .plans {
    position: absolute;
    left: 80px;
    top: 120px;
    display: flex;
    gap: 8px;
  }
  .plan {
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    width: 300px;
    height: 380px;
    flex: none;
    background: #ffffff;
    border: 1px solid #d3d9e2;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(20, 30, 50, 0.06);
    transform: scale(1);
    /* leaving: keep the card on top until it has settled back */
    transition: transform 200ms ease-out, box-shadow 200ms ease-out, z-index 0s linear 200ms;
  }
  .plan:hover {
    z-index: 2;
    transform: scale(1.08);
    box-shadow: 0 22px 44px rgba(20, 30, 50, 0.22);
    transition: transform 200ms ease-out, box-shadow 200ms ease-out, z-index 0s;
  }
  .tag {
    position: absolute;
    top: -8px;
    right: 16px;
    padding: 4px 12px;
    border-radius: 999px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 16px;
  }
  .tag-starter { background: #0f9b8e; }
  .tag-team { background: #6a4fd8; }
  .tag-scale { background: #d9641e; }
  .plan h2 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
  }
  .price {
    margin: 0 0 18px;
    font-size: 40px;
    font-weight: 800;
    line-height: 1.1;
  }
  .price span {
    font-size: 15px;
    font-weight: 500;
    color: #5b6578;
  }
  .plan ul {
    margin: 0 0 24px;
    padding: 0 0 0 18px;
    font-size: 15px;
    line-height: 1.8;
  }
  .plan button {
    display: block;
    width: 100%;
    height: 44px;
    border: 0;
    border-radius: 10px;
    background: #2350d6;
    color: #ffffff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <section class="plans" aria-label="Pricing plans">
    <div class="plan">
      <span class="tag tag-starter">Starter</span>
      <h2>Personal</h2>
      <p class="price">$9<span> / month</span></p>
      <ul>
        <li>5 projects</li>
        <li>Basic reports</li>
        <li>Email support</li>
      </ul>
      <button type="button">Choose Personal</button>
    </div>
    <div class="plan">
      <span class="tag tag-team">Team</span>
      <h2>Growing team</h2>
      <p class="price">$29<span> / month</span></p>
      <ul>
        <li>Unlimited projects</li>
        <li>Shared dashboards</li>
        <li>Priority support</li>
      </ul>
      <button type="button">Choose Growing team</button>
    </div>
    <div class="plan">
      <span class="tag tag-scale">Scale</span>
      <h2>Enterprise</h2>
      <p class="price">$99<span> / month</span></p>
      <ul>
        <li>SSO and audit logs</li>
        <li>Custom retention</li>
        <li>Dedicated manager</li>
      </ul>
      <button type="button">Contact sales</button>
    </div>
  </section>
</body>
</html>
