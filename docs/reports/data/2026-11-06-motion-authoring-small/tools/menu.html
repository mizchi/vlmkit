<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu that can change its mind</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #eef1f5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1d2330;
    overflow-x: hidden;
    position: relative;
  }
  .toolbar {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 120px;
    background: #ffffff;
    box-shadow: 0 1px 0 #d8dde6;
  }
  .menu-wrap {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 120px;
    height: 40px;
  }
  .menu-button {
    display: block;
    box-sizing: border-box;
    width: 120px;
    height: 40px;
    margin: 0;
    padding: 0 16px;
    border: 1px solid #2f5fd0;
    border-radius: 6px;
    background: #2563eb;
    color: #ffffff;
    font: 600 15px/38px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    cursor: pointer;
  }
  .menu-button:focus-visible {
    outline: 2px solid #1e3a8a;
    outline-offset: 2px;
  }
  /* The panel: closed = height 0, transparent. Open = full height, opaque.
     Transitions start from the current value, so a click mid-way turns it round. */
  .menu {
    position: absolute;
    left: 0;
    top: 40px;
    width: 220px;
    height: 0;
    overflow: hidden;
    box-sizing: border-box;
    background: #ffffff;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    opacity: 0;
    visibility: hidden;
    transition:
      height 250ms ease-out,
      opacity 250ms ease-out,
      visibility 250ms ease-out;
    z-index: 10;
  }
  .menu.open {
    height: 200px;
    opacity: 1;
    visibility: visible;
  }
  .menu .item {
    box-sizing: border-box;
    height: 40px;
    line-height: 40px;
    padding: 0 16px;
    font-size: 15px;
    color: #1d2330;
    white-space: nowrap;
    border-bottom: 1px solid #eef1f5;
  }
  .menu .item:last-child { border-bottom: 0; }
  .content {
    position: absolute;
    left: 40px;
    top: 160px;
    font-size: 16px;
    color: #4b5566;
  }
</style>
</head>
<body>
  <header class="toolbar">
    <div class="menu-wrap">
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <div class="menu" id="menu" role="menu">
        <div class="item" role="menuitem">Profile</div>
        <div class="item" role="menuitem">Settings</div>
        <div class="item" role="menuitem">Notifications</div>
        <div class="item" role="menuitem">Billing</div>
        <div class="item" role="menuitem">Sign out</div>
      </div>
    </div>
  </header>
  <main class="content">Page content.</main>
  <script>
    (function () {
      var btn = document.querySelector('.menu-button');
      var menu = document.querySelector('.menu');
      btn.addEventListener('click', function () {
        var open = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
