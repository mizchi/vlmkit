<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed gauge</title>
<style>
  :root {
    --bg: #f4f5f7;
    --ink: #1d2330;
    --dial: #c9ced8;
    --accent: #e0492f;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }
  body {
    position: relative;
    width: 1280px;
    height: 800px;
    overflow: hidden;
  }
  svg.gauge {
    position: absolute;
    left: 80px;
    top: 80px;
    width: 320px;
    height: 200px;
    display: block;
    overflow: visible;
  }
  .dial {
    fill: none;
    stroke: var(--dial);
    stroke-width: 12;
    stroke-linecap: butt;
  }
  .hub {
    fill: var(--ink);
  }
  .needle {
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
    transform-box: view-box;
    transform-origin: 160px 170px;
    transform: rotate(0deg);
    animation: sweep 1200ms ease-out 0ms both;
  }
  @keyframes sweep {
    from { transform: rotate(0deg); }
    to   { transform: rotate(120deg); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d;
      --ink: #e8ebf1;
      --dial: #3a4150;
    }
  }
</style>
</head>
<body>
  <svg class="gauge" viewBox="0 0 320 200" width="320" height="200" aria-label="Speed gauge">
    <path class="dial" d="M40 170 A120 120 0 0 1 280 170"></path>
    <line class="needle" x1="160" y1="170" x2="40" y2="170"></line>
    <circle class="hub" cx="160" cy="170" r="6"></circle>
  </svg>
</body>
</html>
