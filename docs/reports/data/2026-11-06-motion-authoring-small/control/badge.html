<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox avatar with a count</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f4f5f7;
    overflow: hidden;
  }

  /* 64x64 circle, 100px from the left and top of the page. */
  .avatar {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 64px;
    height: 64px;
    box-sizing: border-box;
    border-radius: 50%;
    background:
      radial-gradient(circle at 36% 30%, rgba(255, 236, 210, 0.95) 0%, rgba(255, 236, 210, 0) 52%),
      linear-gradient(160deg, #c98b5e 0%, #7a4b32 55%, #2f2118 100%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
  }

  /* 22px tall red pill. Its centre sits on the avatar's top-right corner
     (the corner of the square box): left 100% = 164px, top 0 = 100px.
     Translate by its own size so the centre is the anchor whatever the width. */
  .badge {
    position: absolute;
    left: 100%;
    top: 0;
    translate: -50% -50%;
    z-index: 1;
    box-sizing: border-box;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    background: #e0322b;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: 700;
    line-height: 22px;
    text-align: center;
    white-space: nowrap;
    transform-origin: 50% 50%;
    /* Starts hidden (scale 0) and holds its end state after the pop. */
    scale: 0;
    animation: badge-pop 400ms ease-out 1000ms both;
  }

  /* Grows from 0 to 115% of its size, then settles to 100%, about its centre. */
  @keyframes badge-pop {
    0%   { scale: 0; }
    70%  { scale: 1.15; }
    100% { scale: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge {
      animation-duration: 1ms;
      animation-delay: 1000ms;
    }
  }
</style>
</head>
<body>
  <div class="avatar" aria-label="Your avatar">
    <span class="badge" aria-label="3 unread">3</span>
  </div>
</body>
</html>
