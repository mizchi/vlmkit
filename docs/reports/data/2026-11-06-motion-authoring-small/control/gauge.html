<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed gauge</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1280px;
    height: 800px;
    background: #ffffff;
    overflow: hidden;
  }

  svg.gauge {
    position: absolute;
    left: 80px;
    top: 80px;
    width: 320px;
    height: 200px;
    display: block;
    overflow: visible;
  }

  .dial {
    fill: none;
    stroke: #1f2937;
    stroke-width: 4;
  }

  .hub {
    fill: #1f2937;
  }

  .needle {
    stroke: #dc2626;
    stroke-width: 4;
    stroke-linecap: butt;
    fill: none;
    /* Rotate about the dial centre (160,170) in the SVG's own user units. */
    transform-box: view-box;
    transform-origin: 160px 170px;
    transform: rotate(0deg);
    animation: sweep-needle 1200ms ease-out 0ms forwards;
  }

  @keyframes sweep-needle {
    from { transform: rotate(0deg); }
    to   { transform: rotate(120deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .needle {
      animation: none;
      transform: rotate(120deg);
    }
  }
</style>
</head>
<body>
  <svg class="gauge" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-label="Speed gauge">
    <path class="dial" d="M 20 170 A 140 140 0 0 1 300 170"></path>
    <line class="needle" x1="160" y1="170" x2="40" y2="170"></line>
    <circle class="hub" cx="160" cy="170" r="7"></circle>
  </svg>
</body>
</html>
