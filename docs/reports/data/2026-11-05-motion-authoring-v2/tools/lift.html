<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #eef1f5; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c2430; }
  .plans {
    position: absolute; left: 80px; top: 120px;
    display: flex; gap: 8px; margin: 0; padding: 0;
  }
  .plan {
    position: relative; z-index: 1;
    width: 300px; height: 380px;
    padding: 28px 24px 24px;
    display: flex; flex-direction: column;
    background: #fff;
    border: 1px solid #d3d9e2; border-radius: 14px;
    box-shadow: 0 0 0 rgba(20, 30, 50, 0);
    transform: scale(1);
    transform-origin: 50% 50%;
    /* settle back over 200ms; stay on top until the settle is done */
    transition: transform 200ms ease-out, box-shadow 200ms ease-out, z-index 0s linear 200ms;
  }
  .plan:hover {
    z-index: 10;
    transform: scale(1.08);
    box-shadow: 0 18px 40px rgba(20, 30, 50, 0.22);
    transition: transform 200ms ease-out, box-shadow 200ms ease-out, z-index 0s linear 0s;
  }
  .tag {
    position: absolute; top: -9px; right: 15px; /* border-box: 8px above the card, 16px in from its right edge */
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #fff;
  }
  .starter .tag { background: #2f7d4f; }
  .team .tag { background: #2557c7; }
  .scale .tag { background: #8a3fb8; }
  .plan h2 { margin: 0 0 8px; font-size: 20px; }
  .price { margin: 0 0 16px; font-size: 32px; font-weight: 700; }
  .price span { font-size: 14px; font-weight: 400; color: #5b6676; }
  .plan ul { margin: 0; padding-left: 20px; flex: 1; color: #3a4453; }
  .plan li { margin-bottom: 6px; }
  .plan button {
    font: inherit; font-weight: 600; color: #fff; background: #1c2430;
    border: 0; border-radius: 8px; padding: 10px 0; width: 100%; cursor: pointer;
  }
</style>
</head>
<body>
  <section class="plans" aria-label="Pricing">
    <div class="plan starter">
      <span class="tag">Starter</span>
      <h2>Basic</h2>
      <p class="price">$9 <span>/ month</span></p>
      <ul><li>1 project</li><li>5 GB storage</li><li>Email support</li></ul>
      <button type="button">Choose Basic</button>
    </div>
    <div class="plan team">
      <span class="tag">Team</span>
      <h2>Pro</h2>
      <p class="price">$29 <span>/ month</span></p>
      <ul><li>10 projects</li><li>50 GB storage</li><li>Priority support</li></ul>
      <button type="button">Choose Pro</button>
    </div>
    <div class="plan scale">
      <span class="tag">Scale</span>
      <h2>Business</h2>
      <p class="price">$79 <span>/ month</span></p>
      <ul><li>Unlimited projects</li><li>500 GB storage</li><li>24/7 support</li></ul>
      <button type="button">Choose Business</button>
    </div>
  </section>
</body>
</html>
