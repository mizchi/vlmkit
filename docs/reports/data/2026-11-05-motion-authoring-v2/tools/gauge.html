<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed gauge</title>
<style>
  html, body { margin: 0; padding: 0; background: #f4f5f7; }
  body { position: relative; min-height: 800px; font-family: system-ui, sans-serif; }
  svg.gauge { position: absolute; left: 80px; top: 80px; width: 320px; height: 200px; display: block; }
  .dial { fill: #ffffff; stroke: #1f2937; stroke-width: 4; }
  .tick { stroke: #6b7280; stroke-width: 2; }
  .hub { fill: #1f2937; }
  .needle {
    stroke: #dc2626; stroke-width: 4; stroke-linecap: round;
    transform-box: view-box;
    transform-origin: 160px 170px;
    animation: sweep 1200ms ease-out 0ms 1 both;
  }
  @keyframes sweep {
    from { transform: rotate(0deg); }
    to   { transform: rotate(120deg); }
  }
</style>
</head>
<body>
<svg class="gauge" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Speed gauge">
  <path class="dial" d="M 20 170 A 140 140 0 0 1 300 170 Z"/>
  <g class="ticks">
    <line class="tick" x1="30" y1="170" x2="45" y2="170"/>
    <line class="tick" x1="160" y1="40" x2="160" y2="55"/>
    <line class="tick" x1="290" y1="170" x2="275" y2="170"/>
    <line class="tick" x1="68.1" y1="78.1" x2="78.7" y2="88.7"/>
    <line class="tick" x1="251.9" y1="78.1" x2="241.3" y2="88.7"/>
  </g>
  <line class="needle" x1="160" y1="170" x2="40" y2="170"/>
  <circle class="hub" cx="160" cy="170" r="7"/>
</svg>
</body>
</html>
