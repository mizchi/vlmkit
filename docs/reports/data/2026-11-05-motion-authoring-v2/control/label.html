<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to cart</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; min-height: 800px;
    background: #eef0f3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1d2330;
  }
  .card {
    position: absolute; left: 0; top: 0;
    width: 360px; height: 300px;
    background: #fff;
    border-radius: 0 0 16px 0;
    box-shadow: 0 2px 10px rgba(20, 30, 50, .08);
  }
  .card .info { position: absolute; left: 40px; top: 108px; right: 40px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 28px; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 20px; color: #5a6272; }
  .card .price { font-size: 18px; font-weight: 700; }
  button.add {
    position: absolute; left: 40px; top: 40px;
    width: 44px; height: 44px;
    margin: 0; padding: 0; border: 0;
    border-radius: 22px;
    background: #1f6feb; color: #fff;
    font: 600 15px/44px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-start;
    overflow: hidden; white-space: nowrap;
    cursor: pointer;
    transition: width 300ms ease-out;
  }
  button.add:focus-visible { outline: 3px solid #0b3d91; outline-offset: 2px; }
  button.add .icon {
    flex: 0 0 44px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  button.add .icon svg { width: 18px; height: 18px; display: block; }
  button.add .label {
    flex: 0 0 auto; white-space: nowrap; line-height: 44px; height: 44px;
    padding-right: 20px;
    opacity: 0;
    transition: opacity 300ms ease-out;
  }
  button.add.added { width: var(--open-w, 188px); }
  button.add.added .label { opacity: 1; }
</style>
</head>
<body>
  <article class="card">
    <button class="add" type="button" aria-label="Add to cart">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M9 2v14M2 9h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></span>
      <span class="label" aria-hidden="true">Added to cart</span>
    </button>
    <div class="info">
      <h2>Canvas Weekender Bag</h2>
      <p>Waxed cotton, leather handles, fits a 15-inch laptop.</p>
      <div class="price">$128.00</div>
    </div>
  </article>
  <script>
    const btn = document.querySelector('button.add');
    btn.addEventListener('click', () => {
      if (btn.classList.contains('added')) return;
      const label = btn.querySelector('.label');
      btn.style.setProperty('--open-w', Math.ceil(44 + label.getBoundingClientRect().width) + 'px');
      btn.classList.add('added');
      btn.setAttribute('aria-label', 'Added to cart');
    });
  </script>
</body>
</html>
