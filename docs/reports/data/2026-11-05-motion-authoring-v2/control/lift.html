<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; min-height: 800px;
    background: #eef1f6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1d2433;
  }
  .plans {
    position: absolute;
    left: 80px; top: 120px;
    display: flex; gap: 8px;
    margin: 0; padding: 0;
  }
  .plan {
    position: relative;
    z-index: 0;
    width: 300px; height: 380px;
    flex: 0 0 300px;
    background: #ffffff;
    border: 1px solid #c9d0dc;
    border-radius: 12px;
    padding: 28px 24px 24px;
    display: flex; flex-direction: column;
    box-shadow: none;
    transform: scale(1);
    transform-origin: 50% 50%;
    transition:
      transform 200ms ease-out,
      box-shadow 200ms ease-out,
      z-index 0s linear 200ms;
  }
  .plan:hover {
    z-index: 10;
    transform: scale(1.08);
    box-shadow: 0 18px 40px rgba(20, 30, 60, 0.22), 0 4px 12px rgba(20, 30, 60, 0.12);
    transition:
      transform 200ms ease-out,
      box-shadow 200ms ease-out,
      z-index 0s linear 0s;
  }
  .tag {
    position: absolute;
    top: -9px; right: 15px; /* border is 1px: 8px above the card's outer edge */
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px; font-weight: 700; line-height: 16px;
    color: #ffffff;
    letter-spacing: 0.02em;
  }
  .tag-starter { background: #2f855a; }
  .tag-team { background: #2563eb; }
  .tag-scale { background: #b4231f; }
  .plan h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  .price { margin: 0 0 16px; font-size: 32px; font-weight: 800; }
  .price span { font-size: 15px; font-weight: 500; color: #5a6475; }
  .plan ul { margin: 0; padding: 0 0 0 18px; font-size: 15px; line-height: 1.7; color: #3a4354; flex: 1; }
  .plan button {
    height: 44px; border: 0; border-radius: 8px;
    background: #1d2433; color: #fff;
    font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <section class="plans" aria-label="Pricing">
    <div class="plan">
      <span class="tag tag-starter">Starter</span>
      <h2>Basic</h2>
      <p class="price">$9<span> / month</span></p>
      <ul><li>1 project</li><li>5 GB storage</li><li>Email support</li></ul>
      <button type="button">Choose Basic</button>
    </div>
    <div class="plan">
      <span class="tag tag-team">Team</span>
      <h2>Pro</h2>
      <p class="price">$29<span> / month</span></p>
      <ul><li>10 projects</li><li>100 GB storage</li><li>Priority support</li></ul>
      <button type="button">Choose Pro</button>
    </div>
    <div class="plan">
      <span class="tag tag-scale">Scale</span>
      <h2>Enterprise</h2>
      <p class="price">$99<span> / month</span></p>
      <ul><li>Unlimited projects</li><li>1 TB storage</li><li>24/7 support</li></ul>
      <button type="button">Choose Enterprise</button>
    </div>
  </section>
</body>
</html>
