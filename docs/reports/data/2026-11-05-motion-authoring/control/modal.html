<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project settings</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 16px/1.4 system-ui, sans-serif; color: #1f2328; background: #f6f7f9; }
  .delete {
    position: absolute; left: 40px; top: 40px; margin: 0;
    padding: 10px 18px; border: 0; border-radius: 6px;
    background: #d11a2a; color: #fff; font: 600 15px/1.2 system-ui, sans-serif; cursor: pointer;
  }
  .delete:hover { background: #b81624; }
  main { position: absolute; left: 40px; top: 110px; width: 600px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  main p { margin: 0; color: #57606a; }

  .backdrop {
    position: fixed; inset: 0; z-index: 10;
    background: #000;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: none;
  }
  .dialog {
    position: fixed; z-index: 11;
    left: calc(50% - 200px); top: calc(50% - 110px);
    width: 400px; height: 220px; box-sizing: border-box;
    padding: 28px; border-radius: 10px; background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    display: flex; flex-direction: column; justify-content: space-between;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(24px) scale(0.95);
    transition: none;
  }
  .dialog h2 { margin: 0 0 8px; font-size: 19px; }
  .dialog p { margin: 0; color: #57606a; }
  .dialog .actions { display: flex; justify-content: flex-end; }
  .cancel {
    padding: 9px 18px; border: 1px solid #d0d7de; border-radius: 6px;
    background: #f6f8fa; color: #1f2328; font: 600 15px/1.2 system-ui, sans-serif; cursor: pointer;
  }

  /* Opening */
  .open .backdrop {
    visibility: visible; pointer-events: auto; opacity: 0.5;
    transition: opacity 200ms linear;
  }
  .open .dialog {
    visibility: visible; pointer-events: auto; opacity: 1; transform: none;
    transition: opacity 250ms ease-out 50ms, transform 250ms ease-out 50ms;
  }
  /* Closing: fade both out over 150ms, transform held; hidden once the fade ends */
  .closing .backdrop, .closing .dialog {
    opacity: 0; pointer-events: none;
    transition: opacity 150ms linear;
  }
  .closing .dialog { transform: none; }
</style>
</head>
<body>
  <button class="delete" type="button">Delete project</button>
  <main>
    <h1>Project "Aurora"</h1>
    <p>Settings and danger zone for this project.</p>
  </main>
  <div class="backdrop"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div>
      <h2 id="dlg-title">Delete this project?</h2>
      <p>This cannot be undone.</p>
    </div>
    <div class="actions"><button class="cancel" type="button">Cancel</button></div>
  </div>
<script>
  const root = document.body;
  document.querySelector('.delete').addEventListener('click', () => {
    root.classList.remove('open', 'closing');
    getComputedStyle(document.querySelector('.dialog')).transform; // commit the closed start state
    getComputedStyle(document.querySelector('.backdrop')).opacity;
    root.classList.add('open');
  });
  document.querySelector('.cancel').addEventListener('click', () => {
    root.classList.add('closing');
  });
  // When the fade-out ends, drop back to the hidden rest state (visibility: hidden).
  document.querySelector('.dialog').addEventListener('transitionend', (e) => {
    if (e.target === e.currentTarget && e.propertyName === 'opacity' && root.classList.contains('closing')) {
      root.classList.remove('open', 'closing');
    }
  });
</script>
</body>
</html>
