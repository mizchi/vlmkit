<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project settings</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #f6f7f9; }
  button { font: inherit; cursor: pointer; }
  .delete {
    position: absolute; left: 40px; top: 40px;
    padding: 10px 18px; border: 0; border-radius: 6px;
    background: #c62828; color: #fff; font-weight: 600;
  }
  .delete:focus-visible, .cancel:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }

  .backdrop {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
  }
  .dialog {
    position: fixed;
    left: calc(50% - 200px); top: calc(50% - 110px);
    width: 400px; height: 220px; box-sizing: border-box;
    padding: 32px; border-radius: 10px;
    background: #fff;
    display: flex; flex-direction: column; justify-content: space-between;
    opacity: 0;
    transform: translateY(24px) scale(0.95);
  }
  .dialog h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
  .dialog p { margin: 0; color: #4a5059; }
  .dialog .actions { display: flex; justify-content: flex-end; }
  .cancel {
    padding: 8px 18px; border: 1px solid #b8bec7; border-radius: 6px;
    background: #fff; color: #1f2328;
  }

  /* Open: the backdrop fades in linearly from the click; the dialog waits 50ms,
     then rises 24px and grows from 95% while it fades in, ease-out, over 250ms. */
  .open .backdrop {
    opacity: 0.5;
    transition: opacity 200ms linear;
  }
  .open .dialog {
    opacity: 1;
    transform: none;
    transition: opacity 250ms ease-out 50ms, transform 250ms ease-out 50ms;
  }
  /* Closing: both fade out together over 150ms; the dialog stays where it is. */
  .closing .backdrop, .closing .dialog {
    opacity: 0;
    transition: opacity 150ms linear;
  }
  .closing .dialog { transform: none; }
</style>
</head>
<body>
  <main>
    <button type="button" class="delete">Delete project</button>
  </main>

  <div class="modal" hidden>
    <div class="backdrop"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
      <div>
        <h2 id="dlg-title">Delete this project?</h2>
        <p id="dlg-desc">This permanently removes the project and its files.</p>
      </div>
      <div class="actions">
        <button type="button" class="cancel">Cancel</button>
      </div>
    </div>
  </div>

<script>
  const modal = document.querySelector('.modal');
  const backdrop = modal.querySelector('.backdrop');
  const del = document.querySelector('.delete');
  const cancel = modal.querySelector('.cancel');

  del.addEventListener('click', () => {
    modal.classList.remove('closing');
    modal.hidden = false;
    void modal.offsetWidth;              // start the transitions from the closed pose
    modal.classList.add('open');
    cancel.focus({ preventScroll: true });
  });

  cancel.addEventListener('click', () => {
    if (!modal.classList.contains('open')) return;
    modal.classList.remove('open');
    modal.classList.add('closing');
  });

  // Once the fade-out has played, take the dialog out of the page entirely.
  backdrop.addEventListener('transitionend', (e) => {
    if (e.target !== backdrop || e.propertyName !== 'opacity') return;
    if (!modal.classList.contains('closing')) return;
    modal.hidden = true;
    modal.classList.remove('closing');
    del.focus({ preventScroll: true });
  });
</script>
</body>
</html>
