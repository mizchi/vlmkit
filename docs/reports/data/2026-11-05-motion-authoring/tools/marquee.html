<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner logos</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; color: #1f2937; font-family: system-ui, sans-serif; }
  .strip {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 1200px;
    height: 80px;
    overflow: hidden;
    background: #f3f4f6;
  }
  .track {
    display: flex;
    width: max-content;
    margin-top: 10px;
    animation: scroll 16s linear infinite;
  }
  .strip:hover .track { animation-play-state: paused; }
  .logo {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 140px;
    height: 60px;
    margin-right: 20px;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-weight: 600;
    font-size: 18px;
    color: #374151;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-1280px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
  }
</style>
</head>
<body>
  <div class="strip">
    <div class="track">
      <span class="logo">Acme</span>
      <span class="logo">Globex</span>
      <span class="logo">Initech</span>
      <span class="logo">Umbrella</span>
      <span class="logo">Hooli</span>
      <span class="logo">Vandelay</span>
      <span class="logo">Stark</span>
      <span class="logo">Wayne</span>
      <span class="logo" aria-hidden="true">Acme</span>
      <span class="logo" aria-hidden="true">Globex</span>
      <span class="logo" aria-hidden="true">Initech</span>
      <span class="logo" aria-hidden="true">Umbrella</span>
      <span class="logo" aria-hidden="true">Hooli</span>
      <span class="logo" aria-hidden="true">Vandelay</span>
      <span class="logo" aria-hidden="true">Stark</span>
      <span class="logo" aria-hidden="true">Wayne</span>
    </div>
  </div>
</body>
</html>
