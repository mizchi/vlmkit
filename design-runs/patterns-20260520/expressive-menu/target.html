<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expressive Menu Target</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --black: #050505;
      --ink: #111111;
      --red: #e60012;
      --paper: #f7f4ec;
      --white: #ffffff;
    }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: Impact, Haettenschweiler, "Arial Black", system-ui, sans-serif;
      letter-spacing: 0;
    }
    .stage {
      position: relative;
      min-height: 100vh;
      padding: 34px 46px 38px;
      isolation: isolate;
      background:
        radial-gradient(circle at 76% 18%, rgba(255,255,255,.09), transparent 0 108px, transparent 109px),
        linear-gradient(132deg, transparent 0 43%, rgba(230,0,18,.94) 43.3% 51.5%, transparent 51.8%),
        var(--black);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: -80px -120px auto auto;
      width: 780px;
      height: 320px;
      background: var(--paper);
      clip-path: polygon(8% 0, 100% 0, 78% 100%, 0 76%);
      transform: rotate(-9deg);
      z-index: -2;
    }
    .stage::after {
      content: "";
      position: absolute;
      left: -96px;
      bottom: 24px;
      width: 660px;
      height: 130px;
      background: var(--red);
      clip-path: polygon(0 18%, 92% 0, 100% 62%, 8% 100%);
      transform: rotate(-4deg);
      z-index: -1;
    }
    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1320px;
      margin: 0 auto;
      min-height: 70px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      line-height: 1;
      color: var(--white);
    }
    .brand-mark {
      width: 58px;
      height: 36px;
      background: var(--red);
      clip-path: polygon(0 20%, 88% 0, 100% 68%, 10% 100%);
      border: 3px solid var(--white);
    }
    .clock {
      background: var(--paper);
      color: var(--ink);
      padding: 10px 18px;
      transform: rotate(2deg);
      box-shadow: 8px 8px 0 var(--red);
      font-size: 20px;
    }
    .poster {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      height: 764px;
      margin: 6px auto 0;
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 24px 34px;
      align-items: stretch;
    }
    .slash-shadow {
      position: absolute;
      left: 18px;
      top: 86px;
      width: 456px;
      height: 592px;
      background: var(--paper);
      clip-path: polygon(13% 0, 100% 8%, 78% 100%, 0 91%);
      transform: rotate(-5deg);
      z-index: -1;
    }
    .menu {
      align-self: center;
      display: grid;
      gap: 14px;
      padding: 46px 34px;
      transform: rotate(-5deg);
      background: transparent;
    }
    .menu button {
      appearance: none;
      border: 0;
      min-height: 70px;
      width: min(386px, 100%);
      padding: 0 24px;
      background: var(--ink);
      color: var(--white);
      font: inherit;
      font-size: 34px;
      text-align: left;
      cursor: pointer;
      clip-path: polygon(0 14%, 92% 0, 100% 72%, 7% 100%);
      transform: skew(-8deg);
      box-shadow: 9px 9px 0 rgba(0,0,0,.38);
    }
    .menu button > span {
      display: inline-block;
      transform: skew(8deg);
    }
    .menu button[data-selected="true"] {
      position: relative;
      width: min(418px, 100%);
      background: var(--red);
      color: var(--white);
      outline: 4px solid var(--white);
      box-shadow: 12px 12px 0 var(--ink);
    }
    .menu button:hover,
    .menu button:focus-visible {
      background: var(--paper);
      color: var(--ink);
      transform: skew(-8deg) translateX(10px);
      outline: 5px solid var(--paper);
      outline-offset: 4px;
    }
    .menu button[data-selected="true"]:hover,
    .menu button[data-selected="true"]:focus-visible {
      background: var(--red);
      color: var(--white);
    }
    .hero-panel {
      position: relative;
      align-self: stretch;
      min-width: 0;
      margin-top: 42px;
      padding: 68px 58px 54px 74px;
      background: var(--paper);
      color: var(--ink);
      clip-path: polygon(8% 0, 100% 5%, 92% 100%, 0 92%);
      transform: rotate(-2deg);
      overflow: hidden;
    }
    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 36px -80px auto auto;
      width: 430px;
      height: 86px;
      background: var(--red);
      transform: rotate(-10deg);
    }
    .eyebrow {
      position: relative;
      display: inline-block;
      padding: 10px 18px;
      margin: 0 0 18px;
      background: var(--ink);
      color: var(--white);
      font-size: 18px;
      transform: rotate(3deg);
    }
    h1 {
      position: relative;
      margin: 0;
      max-width: 760px;
      font-size: 112px;
      line-height: .84;
      color: var(--ink);
    }
    .summary {
      position: relative;
      max-width: 580px;
      margin: 24px 0 0;
      font: 700 22px/1.35 ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
    }
    .burst {
      position: absolute;
      right: 54px;
      bottom: 68px;
      width: 200px;
      height: 200px;
      display: grid;
      place-items: center;
      background: var(--red);
      color: var(--white);
      clip-path: polygon(50% 0, 61% 31%, 94% 20%, 72% 48%, 100% 66%, 64% 65%, 67% 100%, 46% 72%, 17% 96%, 28% 58%, 0 43%, 36% 36%);
      transform: rotate(10deg);
      font-size: 32px;
      text-align: center;
      text-transform: uppercase;
    }
    .status {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: end;
    }
    .status-card {
      min-height: 90px;
      padding: 18px 20px;
      background: var(--ink);
      color: var(--white);
      border: 4px solid var(--paper);
      clip-path: polygon(0 10%, 100% 0, 94% 100%, 4% 92%);
      transform: rotate(.6deg);
    }
    .status-card strong {
      display: block;
      font-size: 28px;
      line-height: 1;
    }
    .status-card span {
      display: block;
      margin-top: 8px;
      font: 700 14px/1.3 ui-sans-serif, system-ui, sans-serif;
      color: #f3d7d8;
    }
  </style>
</head>
<body>
  <div class="stage" data-composition-layer="background">
    <header class="topbar" data-composition-layer="foreground">
      <div class="brand"><span class="brand-mark" data-shape="cutout"></span><strong>Signal Slash</strong></div>
      <div class="clock" data-shape="sticker">20:26 / SHIFT 05</div>
    </header>
    <div class="poster">
      <div class="slash-shadow" data-composition-layer="menu-shadow" data-shape="slash-panel"></div>
      <nav class="menu" aria-label="Primary commands" data-composition-layer="menu-slash">
        <button type="button" data-menu-item><span>Briefing</span></button>
        <button type="button" data-menu-item data-selected="true" aria-current="page" data-accent="red"><span>Dispatch</span></button>
        <button type="button" data-menu-item><span>Archive</span></button>
        <button type="button" data-menu-item><span>Gear</span></button>
        <button type="button" data-menu-item><span>Exit</span></button>
      </nav>
      <main class="hero-panel" aria-labelledby="mission-title" data-composition-layer="content-panel" data-shape="mask">
        <p class="eyebrow" data-shape="sticker">Active operation</p>
        <h1 id="mission-title">Night Dispatch</h1>
        <p class="summary">Route field teams, surface urgent signals, and keep every command reachable as real text.</p>
        <div class="burst" data-shape="burst" data-accent="red">Live<br>Now</div>
      </main>
      <section class="status" aria-label="Dispatch status" data-composition-layer="foreground">
        <div class="status-card" data-shape="ribbon"><strong>04</strong><span>open incidents</span></div>
        <div class="status-card" data-shape="ribbon"><strong>11m</strong><span>average response</span></div>
        <div class="status-card" data-shape="ribbon"><strong>98%</strong><span>signal clarity</span></div>
      </section>
    </div>
  </div>
</body>
</html>
