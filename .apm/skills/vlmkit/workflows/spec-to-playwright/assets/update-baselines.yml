name: update-baselines
# CI is the source of truth for VRT baselines (no local Docker). Run this
# manually when a UI change is INTENTIONAL: it re-renders the baselines in the
# same environment as `ci.yml` and commits them back to the branch you dispatched
# from. Review the resulting commit like any other diff.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --update-snapshots
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no baseline changes"
          else
            git commit -m "test: update VRT baselines [skip ci]"
            git push
          fi
