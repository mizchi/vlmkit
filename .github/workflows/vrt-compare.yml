name: VRT Compare

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/vrt-snapshot-ci.config.json"
      - "fixtures/**"
      - "src/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      before:
        description: "Before HTML file path"
        required: false
        default: ""
      after:
        description: "After HTML file path"
        required: false
        default: ""
      scenario:
        description: "Predefined scenario"
        required: false
        default: "tailwind-to-vanilla"
        type: choice
        options:
          - tailwind-to-vanilla
          - reset-css

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages   # 0.8.1 made src/ entrypoints need built packages
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run VRT Compare
        run: |
          if [ -n "${{ inputs.before }}" ] && [ -n "${{ inputs.after }}" ]; then
            node --experimental-strip-types src/cli/vlmkit.ts compare \
              "${{ inputs.before }}" "${{ inputs.after }}"
          elif [ "${{ inputs.scenario }}" = "reset-css" ]; then
            node --experimental-strip-types src/cli/vlmkit.ts compare \
              --dir fixtures/migration/reset-css \
              --baseline normalize.html \
              --variants modern-normalize.html destyle.html no-reset.html
          else
            node --experimental-strip-types src/cli/vlmkit.ts compare \
              fixtures/migration/tailwind-to-vanilla/before.html \
              fixtures/migration/tailwind-to-vanilla/after.html
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-compare-report
          path: test-results/migration/migration-report.json
          if-no-files-found: warn

  snapshot-false-positive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages   # 0.8.1 made src/ entrypoints need built packages
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start static fixture server
        shell: bash
        run: |
          python3 -m http.server 4174 --directory fixtures/css-challenge >"$RUNNER_TEMP/vrt-fixture-server.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/page.html >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "Fixture server failed to start" >&2
          cat "$RUNNER_TEMP/vrt-fixture-server.log" >&2 || true
          exit 1

      - name: Create snapshot baselines
        run: node --experimental-strip-types src/cli/vlmkit.ts snapshot --config .github/vrt-snapshot-ci.config.json

      - name: Re-run snapshot to measure false positives
        continue-on-error: true
        run: node --experimental-strip-types src/cli/vlmkit.ts snapshot --config .github/vrt-snapshot-ci.config.json

      - name: Summarize snapshot false positive rate
        run: |
          node --experimental-strip-types src/cli/vlmkit.ts snapshot report \
            test-results/snapshots/ci/snapshot-report.json \
            --max-false-positive-rate 0 \
            --max-diff-ratio 0.001 \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-snapshot-false-positive-report
          path: |
            test-results/snapshots/ci/snapshot-report.json
            test-results/snapshots/ci/*.png
          if-no-files-found: warn

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages   # 0.8.1 made src/ entrypoints need built packages
      - run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test fixtures
        run: |
          for fixture in page dashboard form-app; do
            echo "=== Smoke test: $fixture ==="
            node --experimental-strip-types src/cli/vlmkit.ts smoke \
              "fixtures/css-challenge/$fixture.html" \
              --max-actions 15 --seed 42 || true
          done

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages   # 0.8.1 made src/ entrypoints need built packages
      - run: pnpm exec playwright install --with-deps chromium

      # The bench builds the MoonBit `markup-core` package, so it needs the
      # MoonBit `moon` CLI on PATH (otherwise: `spawnSync moon ENOENT`).
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Run CSS benchmark
        run: |
          node --experimental-strip-types src/cli/vlmkit.ts bench \
            --fixture page --trials 15 --no-db

      - name: Run unit tests
        run: pnpm test
