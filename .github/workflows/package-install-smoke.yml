name: package-install-smoke

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "tsdown*.config.ts"
      - "src/**"
      - "packages/**"
      - "scripts/smoke-packed-*.mjs"
      - ".github/workflows/package-install-smoke.yml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "tsdown*.config.ts"
      - "src/**"
      - "packages/**"
      - "scripts/smoke-packed-*.mjs"
      - ".github/workflows/package-install-smoke.yml"
  workflow_dispatch:

jobs:
  package-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: pnpm smoke:pack:workspaces
      - run: pnpm smoke:pack:markup-loop
