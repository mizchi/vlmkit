name: Deploy vlmkit Pages site

# The site is composed from several examples (scripts/build-pages.mjs): the intro page at the
# root and the solitaire demo at /solitaire/. Every section's own contract tests and gates run
# before the artifact is built, so nothing reaches the public site unverified.

on:
  push:
    branches: [main]
    paths:
      - "examples/vlmkit-intro-page/**"
      - "examples/solitaire/**"
      - "scripts/build-pages.mjs"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "examples/vlmkit-intro-page/**"
      - "examples/solitaire/**"
      - "scripts/build-pages.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build JavaScript packages
        run: pnpm build:packages:js

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `vitest run`, not `node --test`. These files import `test` from vitest, and `node --test`
      # fails on the import — which is how this step passed for months and then silently could
      # not run at all after the suite migrated. `page.test.mjs` asserts the runner named here.
      - name: Verify intro page contracts
        run: pnpm exec vitest run examples/vlmkit-intro-page/page.test.mjs

      # The solitaire rules without a browser, then the view WITH one: real drag and drop,
      # keyboard play, the stock, all four animations, and two games PLAYED to 52/52 with the
      # table audited after every ply. This page exists to exercise what a pixel diff cannot see,
      # so a screenshot check would not be a substitute.
      - name: Verify solitaire rules and view
        run: pnpm exec vitest run examples/solitaire/

      # A third seed, won entirely through real `dragAndDrop` rather than through `commit`. The
      # suite above proves the game finishes; this proves the DRAG path finishes it, which is the
      # half a published game is actually played with. ~15s.
      - name: Win a game of solitaire by dragging
        run: node examples/solitaire/playthrough.mjs --solve --seed 7 --gestures --verbose

      - name: Verify the composed site layout
        run: pnpm exec vitest run tests/pages-site.test.mjs

      - name: Run vlmkit dogfood state matrix
        shell: bash
        run: |
          set -euo pipefail
          node examples/vlmkit-intro-page/server.mjs &
          sample_server_pid=$!
          trap 'kill "$sample_server_pid"' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4190/ >/dev/null
          node --experimental-strip-types src/cli/vlmkit.ts gates run \
            --config examples/vlmkit-intro-page/vlmkit.gates.json \
            --output test-results/vlmkit-intro-page-gates \
            --show-output

      # Gated with `?animate=0&seed=1`: the deal is a ~960ms staggered flight and the shuffle is
      # seeded, so without both the gate measures a different page on every run.
      - name: Run vlmkit gates on the solitaire demo
        shell: bash
        run: |
          set -euo pipefail
          still="file://$PWD/examples/solitaire/index.html?seed=1&animate=0"
          node --experimental-strip-types src/cli/vlmkit.ts check integrity "$still"
          node --experimental-strip-types src/cli/vlmkit.ts check a11y focus "$still" \
            --output-dir test-results/solitaire-a11y-focus
          # AAA, not the AA default: the toolbar meets the 44px floor on purpose (see the
          # min-height comment in solitaire.css), and gating at AA would not hold that claim.
          node --experimental-strip-types src/cli/vlmkit.ts check a11y touch "$still" \
            --level AAA --output-dir test-results/solitaire-a11y-touch

      - name: Build the Pages artifact
        run: node scripts/build-pages.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
