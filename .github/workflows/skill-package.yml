name: Skill package

on:
  push:
    branches: [main]
    paths:
      - ".apm/**"
      - ".claude/skills/**"
      - "skills/**"
      - "tests/skill-package.test.mjs"
      - "scripts/sync-skill-package.mjs"
      - "scripts/smoke-skill-installers.mjs"
      - "apm.yml"
      - "justfile"
      - ".github/workflows/skill-package.yml"
  pull_request:
    paths:
      - ".apm/**"
      - ".claude/skills/**"
      - "skills/**"
      - "tests/skill-package.test.mjs"
      - "scripts/sync-skill-package.mjs"
      - "scripts/smoke-skill-installers.mjs"
      - "apm.yml"
      - "justfile"
      - ".github/workflows/skill-package.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        apm-version: ["0.8.11", "0.27.0"]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install APM
        run: python -m pip install "apm-cli==${{ matrix.apm-version }}"

      - name: Verify skill package contracts
        run: node --test tests/skill-package.test.mjs examples/vlmkit-intro-page/page.test.mjs

      - name: Install with APM and skills CLI
        run: node scripts/smoke-skill-installers.mjs
