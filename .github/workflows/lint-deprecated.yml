name: lint-deprecated

# Run on every PR that touches TS source. Cheap (~1s) — pure grep over
# the workspace. Forbids the pre-0.5.0 identifier names from creeping
# back into non-allowlisted source files. Allow-list rules live in
# `scripts/check-deprecated.sh`.

on:
  pull_request:
    paths:
      - "packages/**/*.ts"
      - "src/**/*.ts"
      - "scripts/check-deprecated.sh"
      - ".github/workflows/lint-deprecated.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-deprecated:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-deprecated.sh
