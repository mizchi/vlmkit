# On every pull request from this repository: draw the change map of the PR with
# `vlmkit-anim pr --mermaid` (the areas it touched with their file / line counts,
# the import edges between them, and the commits as a table) and keep one comment
# on the PR up to date with it. The map is a mermaid flowchart, so GitHub renders
# it inline and a reviewer reads the shape of the change before the diff without
# playing an animation.
#
# Forks are skipped: commenting needs a write token, and a PR from a fork has none.
# The generator runs from source (no build) and needs no browser.
name: PR visual

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-map:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Draw the change map
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
        run: |
          node --experimental-strip-types packages/vlmkit-anim/src/cli.ts pr --mermaid \
            --base "$BASE" --head "$HEAD" --title "$TITLE" --name "change-map" --out .vlmkit-anim/pr

      - name: Keep one comment on the PR up to date
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const pr = context.payload.pull_request.number;
            const md = fs.readFileSync(".vlmkit-anim/pr/change-map.md", "utf8");
            const marker = "<!-- vlmkit-anim:change-map -->";
            const body = `${marker}\n${md}\n_Redrawn on every push by \`vlmkit-anim pr --mermaid\`._`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
