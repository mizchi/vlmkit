name: ci
on: [push, pull_request]
jobs:
  e2e:
    # CI is the source of truth for VRT baselines, so they are always rendered in
    # THIS environment. The official Playwright container ships the browsers (no
    # `playwright install`), and ubuntu-latest pins the arch — developers never
    # need Docker locally.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test   # reproducibility: run 1 (verifies against committed baselines)
      - run: pnpm exec playwright test   # reproducibility: run 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-vrt-actuals   # download these to inspect a diff, then dispatch update-baselines if intended
          path: test-results/
