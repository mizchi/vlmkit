name: ci
on: [push, pull_request]
jobs:
  e2e:
    # VRT baselines are arch-specific. baseline-linux.sh produces baselines for the
    # host arch (arm64 on Apple Silicon); use a matching runner so CI agrees. If you
    # author baselines on amd64, switch this to ubuntu-latest and regenerate them there.
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test   # reproducibility: run 1
      - run: pnpm exec playwright test   # reproducibility: run 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
