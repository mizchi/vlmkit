packages:
  - packages/*
# Vite+ (vite-plus) owns the Vite and Vitest versions: every package that asks for
# `vite` or `vitest` gets the copies `vp test` runs, so there is one runner, one
# `expect` and one mock registry. Bump these together with `vite-plus`.
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
