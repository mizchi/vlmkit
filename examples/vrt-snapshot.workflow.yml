# Example GitHub Actions workflow for running `vrt snapshot` on every PR.
# Copy to .github/workflows/ in your project and adjust the start-app step
# for your stack (Next.js, Vite, etc.).
#
# Pair with a `vrt.config.json` at the repo root that defines `baseUrl`,
# `routes`, `mask`, and (optionally) `failOnDiff` / `maxDiffRatio`.

name: VRT Snapshot

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "vrt.config.json"
      - ".github/workflows/vrt-snapshot.yml"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch baselines committed to the repo (under snapshots/)
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Build & start app
        run: |
          pnpm build
          pnpm start &
          # Wait for the dev/prod server to be ready
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run VRT snapshot
        run: npx vrt snapshot --config vrt.config.json

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-snapshot
          path: |
            test-results/snapshots/**/*.png
            test-results/snapshots/**/snapshot-report.json
          if-no-files-found: warn
