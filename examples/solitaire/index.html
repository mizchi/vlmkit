<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klondike Solitaire — vlmkit DnD / animation example</title>
<!--
  Klondike solitaire, the Windows sol.exe layout, in plain HTML/CSS/JS.

  It exists to exercise the two things a pixel diff cannot see on its own — DRAG AND DROP and
  ANIMATION — against a page that is a real application rather than a fixture: seven tableau
  piles, four foundations, a stock and a waste, full rules, keyboard play, and the bouncing
  win cascade.

    rules.js      the rules, pure and DOM-free (tested by rules.test.mjs, no browser)
    solitaire.css layout, card faces, and the four animations
    game.js       DOM, HTML5 drag and drop, keyboard, animation wiring

  No build step, no dev server, no external assets: classic scripts and a linked stylesheet, so
  every gate runs straight off the filesystem.

    vlmkit check integrity  examples/solitaire/index.html
    vlmkit scan handlers    examples/solitaire/index.html --probe-drag
    vlmkit check animation  examples/solitaire/index.html --strip strip.png
    vlmkit check a11y focus examples/solitaire/index.html

  URL parameters, which exist for those gates as much as for players:

    ?seed=N     fix the deal. The shuffle is a seeded PRNG, so seed 1 is the same game on
                every machine — without it a screenshot differs every run and a VRT baseline
                is meaningless.
    ?draw=1|3   Windows' "Draw one" / "Draw three".
    ?animate=0  skip every animation. The opening deal is a ~960ms staggered flight (measured:
                `check animation` reports `settle: 962ms`), so a gate that screenshots on load
                catches the table mid-air — and a card at `opacity: 0.2` mid-flight measures as
                a contrast failure that does not exist once it lands. The alternative is to wait
                for `document.body[data-deal-complete="true"]`.

  Rules, in full: build the four foundations up from the Ace in suit; build the tableau down in
  alternating colours; only a King starts an empty column; a face-up descending run moves as
  one unit; the stock deals to the waste and the waste turns back over IN ORDER when it runs
  out (a reshuffle there would make the game unlosable).
-->
<link rel="stylesheet" href="solitaire.css">
</head>
<body>

<header class="toolbar">
  <h1>Klondike Solitaire</h1>
  <button id="new-game" type="button">New game</button>
  <button id="restart" type="button">Restart this deal</button>
  <button id="auto-finish" type="button">Auto-finish</button>
  <!--
    A real toggle, so it carries aria-pressed. `check interactions` probes controls for an ARIA
    state transition and reports one that changes the page while announcing nothing.
  -->
  <button id="toggle-animation" type="button" aria-pressed="true">Animations: on</button>
  <label for="draw-count">Deal</label>
  <select id="draw-count">
    <option value="1">Draw one</option>
    <option value="3">Draw three</option>
  </select>

  <div class="status">
    <span>Moves <output id="moves">0</output></span>
    <span>Left <output id="remaining">52</output></span>
  </div>

  <!--
    Back to the site this page is published under. Relative: on GitHub Pages this page lives at
    /vlmkit/solitaire/ and the intro page at /vlmkit/, so "../" is the site root — an absolute
    "/" would leave the project site entirely. Locally it resolves to `examples/`, which is the
    honest answer to "up one level" when there is no site around it.
  -->
  <a class="site-link" href="../">← vlmkit</a>
</header>

<main class="table" id="table">
  <!--
    Stock and waste on the left, foundations on the right, one empty column between — the
    Windows arrangement, done with `grid-column` so the gap is not a meaningless empty node in
    the accessibility tree.
  -->
  <div class="row row-top">
    <!--
      The stock is a button: it is clicked to deal, so it has to be reachable and operable by
      keyboard. A `div` with a click handler is what `scan handlers` reports as a
      pointer-only control.
    -->
    <button class="slot stock-slot" id="stock" type="button" aria-label="Stock"></button>
    <div class="slot waste-slot" id="waste" tabindex="0" aria-label="Waste"></div>

    <!--
      Every pile is a tab stop. The hint below says "Tab to a pile", and without `tabindex` the
      piles were not focusable at all — the keyboard flow was documented and unreachable, which
      a browser test caught. Twelve extra stops on a card game is the cost of being playable
      without a pointer.

      A real container, because game.js addresses the four foundations by index. It is
      `display: contents` so the four slots still participate in the row's seven-column grid —
      a normal wrapper would become one grid item and collapse the four into a single column.
    -->
    <div class="foundations" id="foundations">
      <div class="slot foundation-slot" tabindex="0" data-hint="&#9824;" aria-label="Foundation, spades"></div>
      <div class="slot foundation-slot" tabindex="0" data-hint="&#9829;" aria-label="Foundation, hearts"></div>
      <div class="slot foundation-slot" tabindex="0" data-hint="&#9830;" aria-label="Foundation, diamonds"></div>
      <div class="slot foundation-slot" tabindex="0" data-hint="&#9827;" aria-label="Foundation, clubs"></div>
    </div>
  </div>

  <div class="row" id="tableau">
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 1"></div>
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 2"></div>
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 3"></div>
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 4"></div>
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 5"></div>
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 6"></div>
    <div class="slot tableau-slot" tabindex="0" aria-label="Tableau 7"></div>
  </div>

  <p class="win-banner" id="win-banner" hidden>You win.</p>
</main>

<p class="hint">
  Drag a card onto a pile, or <strong>double-click</strong> to send it to a foundation.
  Keyboard: <kbd>Tab</kbd> to a card, <kbd>Enter</kbd> to pick it up, <kbd>Tab</kbd> to a pile,
  <kbd>Enter</kbd> to place, <kbd>Esc</kbd> to put it back.
</p>

<!--
  The live region for move announcements. Outside `.table` so a re-render of the table cannot
  replace the node itself — a live region that gets recreated stops being announced.
-->
<div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>

<script src="rules.js"></script>
<script src="game.js"></script>
</body>
</html>
