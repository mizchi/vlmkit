<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harbor — deploy previews</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1c2430; background: #fff; }
  .hero { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.15; }
  .lede { margin: 0; font-size: 20px; color: #3d4a5c; }
  .cta { display: inline-block; margin-top: 24px; padding: 12px 20px; border-radius: 8px; background: #1b5cff; color: #fff; text-decoration: none; font-weight: 600; }
  /* Defect 2: the pricing note was hidden with the same colour as the page. */
  .note { margin-top: 16px; color: #ffffff; font-size: 14px; }
  .quotes { display: grid; gap: 16px; margin-top: 40px; }
  blockquote { margin: 0; padding: 16px; border-left: 4px solid #1b5cff; background: #f3f6fc; }
</style>
</head>
<body>
<section class="hero">
  <h1>Every branch, deployed</h1>
  <p class="lede">Harbor builds a preview for each pull request and posts the link where your reviewers already are.</p>
  <!-- Defect 1: the button was reworded; the spec says "Start a free trial". -->
  <a class="cta" href="#start">Try it free</a>
  <p class="note">Free for open-source projects.</p>
  <div class="quotes">
    <!-- Defect 3: the testimonial was never written. -->
    <blockquote>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</blockquote>
    <blockquote>We review twice as many changes a week. — Mika, platform lead</blockquote>
  </div>
</section>
</body>
</html>
