<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pricing</title><style>
body{margin:0;background:#f3f4f6;font:15px/1.4 system-ui,sans-serif;color:#111827}
.row{position:absolute;left:80px;top:120px;display:flex;gap:8px}
div.plan{position:relative;width:300px;height:380px;box-sizing:border-box;padding:24px;background:#fff;border:1px solid #d1d5db;border-radius:12px;
transition:transform 200ms ease-out,box-shadow 200ms ease-out}
div.plan:hover{transform:scale(1.08);box-shadow:0 18px 40px #0003;transition:transform 200ms ease-out,box-shadow 200ms ease-out}
.tag{position:absolute;right:16px;top:-8px;padding:2px 8px;border-radius:6px;background:#2563eb;color:#fff;font-size:12px}
.price{font-size:32px;font-weight:700;margin:8px 0}
button{margin-top:16px;font:inherit;padding:8px 14px}
</style></head><body><div class="row">
<div class="plan"><span class="tag">Starter</span><h3>Starter</h3><p class="price">$9</p><ul><li>1 project</li><li>Email support</li></ul><button>Choose</button></div>
<div class="plan"><span class="tag">Team</span><h3>Team</h3><p class="price">$29</p><ul><li>10 projects</li><li>Chat support</li></ul><button>Choose</button></div>
<div class="plan"><span class="tag">Scale</span><h3>Scale</h3><p class="price">$99</p><ul><li>Unlimited</li><li>Phone support</li></ul><button>Choose</button></div>
</div></body></html>
