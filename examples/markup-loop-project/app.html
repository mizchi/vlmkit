<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operations Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      body {
        margin: 0;
      }

      header {
        border-bottom: 1px solid #d6dbe3;
        background: #ffffff;
      }

      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        font-weight: 720;
      }

      main {
        display: grid;
        gap: 20px;
      }

      .toolbar,
      .summary,
      .panel {
        border: 1px solid #d6dbe3;
        border-radius: 8px;
        background: #ffffff;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 650;
        color: #44505f;
      }

      input {
        width: 280px;
        box-sizing: border-box;
        border: 1px solid #b9c1cc;
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
      }

      button {
        border: 1px solid #1867b7;
        border-radius: 6px;
        background: #1f7dd1;
        color: #ffffff;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .metric {
        padding: 18px;
        border-right: 1px solid #d6dbe3;
      }

      .metric:last-child {
        border-right: 0;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 24px;
      }

      .panel {
        overflow: hidden;
      }

      .panel header {
        padding: 16px;
        border-bottom: 1px solid #d6dbe3;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid #e3e7ed;
        text-align: left;
      }

      .status {
        display: inline-flex;
        border-radius: 999px;
        background: #fff4d7;
        color: #7a4c00;
        padding: 4px 8px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell topbar">
        <h1>Operations Dashboard</h1>
        <button data-testid="approve-deployment">Approve deployment</button>
      </div>
    </header>
    <main class="shell">
      <section class="toolbar" aria-label="Service filters">
        <label for="service-filter">
          Filter services
          <input id="service-filter" type="search" placeholder="Search service name" />
        </label>
        <p data-testid="incident-summary">2 incidents need review</p>
      </section>
      <section class="summary" aria-label="Deployment summary">
        <div class="metric" data-testid="service-health">
          Service health
          <strong>94%</strong>
        </div>
        <div class="metric" data-testid="open-incidents">
          Open incidents
          <strong>2</strong>
        </div>
        <div class="metric" data-testid="deploy-window">
          Deploy window
          <strong>18:00 UTC</strong>
        </div>
      </section>
      <section class="panel" aria-label="Release queue">
        <header>
          <h2>Release queue</h2>
        </header>
        <table>
          <thead>
            <tr>
              <th>Service</th>
              <th>Status</th>
              <th>Owner</th>
            </tr>
          </thead>
          <tbody>
            <tr data-testid="row-billing-api">
              <td>Billing API</td>
              <td><span class="status">Needs review</span></td>
              <td>Platform</td>
            </tr>
            <tr data-testid="row-search-index">
              <td>Search Index</td>
              <td><span class="status">Ready</span></td>
              <td>Data</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
