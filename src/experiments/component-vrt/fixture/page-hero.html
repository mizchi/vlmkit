<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>component-vrt experiment — hero-dominated page</title>
<link rel="stylesheet" href="./components.css">
<style>
  /* Page-level layout only; the components style themselves. */
  .page { padding: 32px; display: flex; flex-direction: column; gap: 40px; }
  .row { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
  h2 { font: 600 13px/1 Inter, sans-serif; color: #8b97a3; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<!-- ADVERSARIAL on purpose: this page is dominated by two LARGE components. When a mutation lands on Hero or DataTable the component-scoped shot is nearly page-sized, so the size advantage should collapse. If it does not collapse here, the earlier result was an artefact of only using small components. -->
<div class="page" id="page"></div>
<script src="./_markup.js"></script>
<script>
  const C = globalThis.COMPONENTS;
  const section = (label, html) => `<section><h2>${label}</h2><div class="row">${html}</div></section>`;
  document.getElementById("page").innerHTML = [
    section("Hero", C.Hero({})),
    section("Table", C.DataTable({ rows: 8 })),
    section("Actions", C.Button({})),
  ].join("");
</script>
</body>
</html>
